[tools]
node = "26"
# trust_policy_excludes: mise 2026.8.2's aube npm backend added a "no-downgrade"
# supply-chain trust gate. jco's transitive dep @oxc-parser/binding-*@0.76.0
# dropped its provenance attestation (0.13.3 had it; oxc restored it in 0.90.0+),
# which the gate flags as a downgrade and refuses to install. Bumping jco does
# NOT help — its dependency tree still resolves oxc 0.76.0 (verified on 1.27.0).
# Remove this exclude once jco pulls a signed oxc (>=0.90.0) or mise stops
# flagging it. See https://aube.jdx.dev/security#trust-policy
"npm:@bytecodealliance/jco" = { version = "1.42.0", trust_policy_excludes = ["@oxc-parser/binding-*"] }

# =============================================================================
# JavaScript bindings tasks (browser/Node.js via jco)
# =============================================================================

[tasks.wasm-build]
description = "Build eryx WASM runtime (delegates to root mise task)"
sources = [
  "../crates/eryx-guest-python/src/**/*.rs",
  "../crates/eryx-guest-python/Cargo.toml",
  "../crates/eryx-runtime/wit/**/*.wit",
]
outputs = ["../crates/eryx-runtime/runtime-python.wasm"]
run = """
cd .. && mise run build-runtime-python
"""

[tasks.wasm-build-guests]
description = "Build the JavaScript and shell WASM runtimes (delegates to root mise tasks)"
# After wasm-build, not alongside it: both install the guest toolchain, and two
# concurrent rustup installs of it collide.
depends = ["wasm-build"]
sources = [
  "../crates/eryx-guest-js/src/**/*",
  "../crates/eryx-guest-js/Cargo.toml",
  "../crates/eryx-guest-python/clock_stubs.c",
  "../crates/wit-dylib-ffi/src/**/*.rs",
  "../crates/wit-dylib-ffi/Cargo.toml",
  "../crates/eryx-guest-shell/src/**/*",
  "../crates/eryx-guest-shell/Cargo.toml",
  "../crates/eryx-guest-shell/Cargo.lock",
  "../crates/eryx-runtime/wit/**/*.wit",
]
outputs = [
  "../crates/eryx-runtime/runtime-javascript.wasm",
  "../crates/eryx-runtime/runtime-shell-p2.wasm",
]
# The shell's WASI 0.2 build: this package's shims are WASI 0.2 only, while the
# shell otherwise ships for WASI 0.3 (runtime-shell.wasm); see #918.
run = """
cd .. && mise run build-runtime-javascript && mise run build-runtime-shell-p2
"""

[tasks.extract-stdlib]
description = "Extract Python stdlib for pre-initialization"
depends = ["wasm-build"]
sources = ["../crates/eryx/python-stdlib.tar.zst"]
outputs = [
  "../crates/eryx-guest-python/tests/python-stdlib/encodings/__init__.py",
]
run = """
#!/usr/bin/env bash
set -euo pipefail
cd ../crates/eryx-guest-python
PYTHON_LIB="../eryx/python-stdlib.tar.zst"
if [[ ! -f "$PYTHON_LIB" ]]; then
    echo "Error: python-stdlib.tar.zst not found at $PYTHON_LIB"
    exit 1
fi
if [[ -d "tests/python-stdlib/encodings" ]]; then
    echo "Python stdlib already extracted"
    exit 0
fi
echo "Extracting $PYTHON_LIB"
rm -rf tests/python-stdlib-tmp tests/python-stdlib
mkdir -p tests/python-stdlib-tmp
tar -xf "$PYTHON_LIB" -C tests/python-stdlib-tmp
mv tests/python-stdlib-tmp/python-stdlib tests/python-stdlib
rm -rf tests/python-stdlib-tmp
"""

[tasks.preinit]
description = "Pre-initialize Python in the WASM component (bakes in stdlib)"
depends = ["wasm-build", "extract-stdlib"]
sources = ["../crates/eryx-runtime/runtime-python.wasm"]
outputs = ["../crates/eryx-runtime/runtime-preinit.wasm"]
env = { ERYX_PRECOMPILE_BOOTSTRAP = "1" }
run = """
cd .. && cargo run -p eryx-precompile --release -- compile \
  crates/eryx-runtime/runtime-python.wasm \
  --preinit \
  --stdlib crates/eryx-guest-python/tests/python-stdlib \
  --wasm-only \
  --output crates/eryx-runtime/runtime-preinit.wasm \
  --no-verify
"""

[tasks.transpile]
description = "Transpile WASM component to JavaScript using jco (imports are supplied per instance by index.js)"
depends = ["preinit"]
sources = ["../crates/eryx-runtime/runtime-preinit.wasm"]
outputs = ["eryx/eryx-sandbox.js", "eryx/eryx-sandbox.core.wasm"]
run = """
jco transpile \
  ../crates/eryx-runtime/runtime-preinit.wasm \
  --name eryx-sandbox \
  --out-dir eryx \
  --instantiation async \
  --async-mode jspi \
  --async-imports \
    'eryx:net/tcp@0.1.0#connect' 'eryx:net/tcp@0.1.0#read' 'eryx:net/tcp@0.1.0#write' \
    'eryx:net/tls@0.1.0#upgrade' 'eryx:net/tls@0.1.0#read' 'eryx:net/tls@0.1.0#write'
"""

[tasks.transpile-guests]
description = "Transpile the JavaScript and shell WASM components (loaded on first use, so no typings)"
depends = ["wasm-build-guests"]
sources = [
  "../crates/eryx-runtime/runtime-javascript.wasm",
  "../crates/eryx-runtime/runtime-shell-p2.wasm",
]
outputs = ["eryx/eryx-sandbox-javascript.js", "eryx/eryx-sandbox-shell.js"]
run = """
#!/usr/bin/env bash
set -euo pipefail
# jco writes typings even with --no-typescript, and they would replace the
# Python component's interfaces/; transpile elsewhere and keep the code only.
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
# The shell's WASI 0.2 build (see wasm-build-guests).
for component in javascript:runtime-javascript shell:runtime-shell-p2; do
  language=${component%%:*}
  jco transpile \
    "../crates/eryx-runtime/${component#*:}.wasm" \
    --name "eryx-sandbox-$language" \
    --out-dir "$out" \
    --quiet \
    --instantiation async \
    --async-mode jspi \
    --async-imports \
      'eryx:net/tcp@0.1.0#connect' 'eryx:net/tcp@0.1.0#read' 'eryx:net/tcp@0.1.0#write' \
      'eryx:net/tls@0.1.0#upgrade' 'eryx:net/tls@0.1.0#read' 'eryx:net/tls@0.1.0#write'
done
rm -f eryx/eryx-sandbox-*.js eryx/eryx-sandbox-*.wasm
cp "$out"/eryx-sandbox-*.js "$out"/eryx-sandbox-*.wasm eryx/
"""

[tasks.coreutils-build]
description = "Build uutils coreutils (the shell's bundled commands; delegates to the root mise task)"
sources = ["../clis/coreutils.toml", "../clis/patches/patch-uucore-wasip2.sh"]
outputs = ["../crates/eryx-runtime/coreutils.wasm"]
run = """
cd .. && mise run build-coreutils
"""

[tasks.transpile-coreutils]
description = "Transpile coreutils for the shell sandbox's external commands (loaded on first use)"
depends = ["coreutils-build"]
sources = ["../crates/eryx-runtime/coreutils.wasm"]
outputs = ["eryx/eryx-coreutils.js"]
run = """
#!/usr/bin/env bash
set -euo pipefail
# A plain WASI 0.2 command: no JSPI, since shims/process.js runs it to
# completion in one call. Typings are dropped, as for the guests.
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
jco transpile ../crates/eryx-runtime/coreutils.wasm \
  --name eryx-coreutils \
  --out-dir "$out" \
  --quiet \
  --instantiation async
rm -f eryx/eryx-coreutils.js eryx/eryx-coreutils.*.wasm
cp "$out"/eryx-coreutils.js "$out"/eryx-coreutils.*.wasm eryx/
"""

[tasks.patch-js]
description = "Patch generated JS for webpack compat and jco codegen bugs"
depends = ["transpile", "transpile-guests", "transpile-coreutils"]
sources = [
  "eryx/eryx-sandbox.js",
  "eryx/eryx-sandbox-javascript.js",
  "eryx/eryx-sandbox-shell.js",
  "eryx/eryx-coreutils.js",
  "patch-jco.cjs",
]
outputs = [
  "eryx/eryx-sandbox.js",
  "eryx/eryx-sandbox-javascript.js",
  "eryx/eryx-sandbox-shell.js",
  "eryx/eryx-coreutils.js",
]
run = "node patch-jco.cjs"

[tasks.build]
description = "Build JavaScript bindings (WASM + transpile + version sync + stdlib)"
depends = ["patch-js"]
sources = [
  "eryx/eryx-sandbox.js",
  "../Cargo.toml",
  "../crates/eryx/python-stdlib.tar.gz",
]
outputs = ["eryx/package.json", "eryx/python-stdlib.tar.gz"]
run = """
#!/usr/bin/env bash
set -euo pipefail
VERSION=$(cargo metadata --format-version 1 --manifest-path ../Cargo.toml | jq -r '.packages[] | select(.name == "eryx") | .version')
jq --arg v "$VERSION" '.version = $v' eryx/package.json > eryx/package.json.tmp
mv eryx/package.json.tmp eryx/package.json
cp ../crates/eryx/python-stdlib.tar.gz eryx/python-stdlib.tar.gz
"""

[tasks.test]
description = "Run JavaScript tests"
depends = ["build"]
sources = ["eryx/**/*.js", "eryx/**/*.wasm", "testpkg/**/*.ts"]
dir = "testpkg"
run = """
cd ../eryx && npm ci
cd .. && node patch-jco.cjs
cd testpkg && npm ci && npm run typecheck && npm run test:ci
"""

[tasks.copy-examples]
description = "Download example packages for the demo Packages tab"
dir = "demo/public"
run = """
#!/usr/bin/env bash
set -euo pipefail
mkdir -p examples
HUMANIZE="examples/humanize-4.15.0-py3-none-any.whl"
NUMPY="examples/numpy-wasi.tar.gz"
if [[ ! -f "$HUMANIZE" ]]; then
  echo "Downloading humanize wheel from PyPI..."
  curl -fSL -o "$HUMANIZE" \
    "https://files.pythonhosted.org/packages/c5/7b/bca5613a0c3b542420cf92bd5e5fb8ebd5435ce1011a091f66bb7693285e/humanize-4.15.0-py3-none-any.whl"
else
  echo "humanize wheel already present, skipping"
fi
if [[ ! -f "$NUMPY" ]]; then
  echo "Downloading numpy-wasi.tar.gz from GitHub release..."
  curl -fSL -o "$NUMPY" \
    "https://github.com/eryx-org/eryx/releases/download/demo-assets/numpy-wasi.tar.gz"
else
  echo "numpy-wasi.tar.gz already present, skipping"
fi
echo "Example packages ready:"
ls -lh examples/
"""

[tasks.linker-wasm]
description = "Build the demo's linker wasm, which it imports (delegates to root mise task)"
run = "cd .. && mise run build-linker-wasm"

[tasks.demo]
description = "Serve the browser demo on localhost with Vite dev server"
depends = ["build", "copy-examples", "linker-wasm"]
dir = "demo"
run = """
#!/usr/bin/env bash
set -euo pipefail
npm install
npx vite --open --host
"""

[tasks.demo-build]
description = "Build the demo site for production (static output in demo/dist/)"
depends = ["build", "copy-examples", "linker-wasm"]
dir = "demo"
run = """
#!/usr/bin/env bash
set -euo pipefail
npm install
npx vite build
"""

[tasks.demo-preview]
description = "Build and preview the demo site in production mode"
depends = ["demo-build"]
dir = "demo"
run = "npx vite preview --open"

[tasks.clean]
description = "Clean JavaScript build artifacts (generated files only)"
dir = "eryx"
run = "rm -rf eryx-sandbox.js eryx-sandbox.d.ts eryx-sandbox.*.wasm eryx-sandbox-*.js eryx-sandbox-*.wasm interfaces"

[tasks.publish]
description = "Publish JavaScript package to npm"
depends = ["test"]
dir = "eryx"
run = "npm publish --access public"
