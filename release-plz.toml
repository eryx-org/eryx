[workspace]
# Set the path of all the crates to the changelog to the root of the repository
# so we get a single changelog with all changes.
# See https://release-plz.ieni.dev/docs/extra/single-changelog#all-packages.
changelog_path = "./CHANGELOG.md"

# Create git tags for releases
git_tag_enable = true

# One GitHub release per version, eryx's; the other crates only get tags. The
# release-plz workflow fills its notes with every crate's CHANGELOG.md section
# (scripts/release-notes.sh), and the Python/JS/runtime release workflows run
# off it.
#
# eryx-precompile still gets a release of its own, but from cargo-dist
# (.github/workflows/eryx-precompile-release.yml), which creates it with the
# binaries when release-plz pushes the eryx-precompile tag.
git_release_enable = false

[[package]]
name = "eryx"
git_release_enable = true

# eryx-build is a build tool for command components (eryx-commands pins a
# published version); it versions with the workspace.
#
# `publish = false` for now: release-plz publishes through crates.io trusted
# publishing, which only works for a crate that already exists with a
# trusted publisher. Ben publishes the first version by hand with a token
# and sets up the trusted publisher; then this line goes, and release-plz
# publishes it like the other crates.
[[package]]
name = "eryx-build"
publish = false

[changelog]
body = """

## `{{ package }}` - [{{ version | trim_start_matches(pat="v") }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
{%- if commit.scope -%}
- *({{commit.scope}})* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}{%- if commit.links %} ({% for link in commit.links %}[{{link.text}}]({{link.href}}) {% endfor -%}){% endif %}
{% else -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% endif -%}
{% endfor -%}
{% endfor -%}
"""
