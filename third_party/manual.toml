# Third-party code that ships in eryx's artifacts but isn't a Rust crate in
# one of the lock files cargo-about reads (see about.toml): C libraries,
# CPython, vendored JavaScript and the command components. scripts/notices.py
# appends each entry's licence files to the notices of the artifacts it lists,
# and its `check` fails when a shipped input below has no entry, or an entry's
# version no longer matches what's vendored.
#
# Each entry:
#   name, version, license (SPDX), url  - what it is
#   files     - licence and notice texts, relative to the repo root
#   artifacts - which notices it goes in (the names in scripts/notices.py)
#   covers    - vendored files this entry accounts for, as
#               { path, sha256 }: the check fails on a file in
#               crates/eryx-runtime/libs/ or prebuilt/ no entry covers, and on
#               a covered file whose sha256 doesn't match (so re-vendoring
#               libs/ means updating its entry). prebuilt/ is rebuilt with
#               the guest, so its entries leave sha256 out.
#   stdlib    - top-level names in the bundled Python stdlib
#               (crates/eryx/python-stdlib.tar.*) this entry accounts for;
#               the check fails on a name no entry lists
#   version_strings - C strings that must appear in a covered file, as
#               { path, strings }, so the version recorded here is the one
#               vendored
#   rust_toolchain - for code that comes with a Rust toolchain (its standard
#               library, the libc of its wasm targets): the toolchain, which
#               must be one rust-toolchain.toml or mise.toml pins, and each
#               artifact scripts/notices.py's STD lists needs an entry with
#               its toolchain
#   sysroot_strings - strings that must appear in files of that toolchain's
#               sysroot, as { paths, strings }, so the version recorded here
#               is the one the toolchain ships
#   crate     - for code that arrives inside a Rust crate: the crate whose
#               Cargo.lock version `crate_version` must match
#   npm       - vendored npm package name, matched against the `name@version`
#               lines in crates/eryx-guest-js/src/node/*.js

