# Third-party code that ships in eryx's artifacts but isn't a Rust crate in
# one of the lock files cargo-about reads (see about.toml): C libraries,
# CPython, vendored JavaScript and the command components. scripts/notices.py
# appends each entry's licence files to the notices of the artifacts it lists,
# and its `check` fails when a shipped input below has no entry, or an entry's
# version no longer matches what's vendored.
#
# Each entry:
#   name, version, license (SPDX), url  - what it is
#   files     - licence and notice texts, relative to the repo root
#   artifacts - which notices it goes in (the names in scripts/notices.py)
#   covers    - vendored files this entry accounts for, relative to the repo
#               root (the check fails on an uncovered crates/eryx-runtime/libs
#               file)
#   crate     - for code that arrives inside a Rust crate: the crate whose
#               Cargo.lock version `crate_version` must match
#   npm       - vendored npm package name, matched against the `name@version`
#               lines in crates/eryx-guest-js/src/node/*.js

[[component]]
name = "CPython"
version = "3.14.0"
license = "PSF-2.0"
url = "https://github.com/python/cpython/tree/v3.14.0"
# The PSF licence, plus the licences of the code CPython incorporates (expat,
# libmpdec, SipHash, dtoa, ...), from its Doc/license.rst.
files = [
    "third_party/licenses/cpython-LICENSE",
    "third_party/licenses/cpython-incorporated-software.rst",
]
artifacts = ["runtime-python"]
covers = ["crates/eryx-runtime/libs/libpython3.14.so.zst"]

[[component]]
name = "SQLite"
version = "3.51.2"
license = "blessing"
url = "https://sqlite.org/copyright.html"
# Public domain; libpython links it for the sqlite3 module. No notice is
# required, so this entry only records it.
files = []
artifacts = ["runtime-python"]

[[component]]
name = "wasi-libc"
version = "wasi-sdk-33 (161b3195)"
license = "Apache-2.0 WITH LLVM-exception AND Apache-2.0 AND MIT AND BSD-2-Clause"
url = "https://github.com/WebAssembly/wasi-libc/tree/161b3195fc2558d2b1ba3eb9ffae3b2b47407623"
# wasi-libc itself, the musl code in it, and cloudlibc. Every artifact built
# for WASI links it: the C guests through libs/, the Rust ones through
# Rust's self-contained wasm targets.
files = [
    "third_party/licenses/wasi-libc-LICENSE-APACHE-LLVM",
    "third_party/licenses/wasi-libc-LICENSE-APACHE",
    "third_party/licenses/wasi-libc-LICENSE-MIT",
    "third_party/licenses/wasi-libc-musl-COPYRIGHT",
    "third_party/licenses/wasi-libc-cloudlibc-LICENSE",
]
artifacts = [
    "runtime-python",
    "runtime-javascript",
    "runtime-shell",
    "coreutils",
    "eryx-bundler",
]
covers = [
    "crates/eryx-runtime/libs/libc.so.zst",
    "crates/eryx-runtime/libs/libwasi-emulated-getpid.so.zst",
    "crates/eryx-runtime/libs/libwasi-emulated-mman.so.zst",
    "crates/eryx-runtime/libs/libwasi-emulated-process-clocks.so.zst",
    "crates/eryx-runtime/libs/libwasi-emulated-signal.so.zst",
]

[[component]]
name = "libc++ and libc++abi"
version = "wasi-sdk-33 (llvm-project 4434dabb)"
license = "Apache-2.0 WITH LLVM-exception"
url = "https://github.com/llvm/llvm-project/tree/4434dabb69916856b824f68a64b029c67175e532"
files = [
    "third_party/licenses/llvm-libcxx-LICENSE.TXT",
    "third_party/licenses/llvm-libcxxabi-LICENSE.TXT",
]
artifacts = ["runtime-python", "runtime-javascript"]
covers = [
    "crates/eryx-runtime/libs/libc++.so.zst",
    "crates/eryx-runtime/libs/libc++abi.so.zst",
]

[[component]]
name = "wasi_snapshot_preview1 adapter (Wasmtime)"
version = "as vendored with libs/ (componentize-py 874d8af)"
license = "Apache-2.0 WITH LLVM-exception"
url = "https://github.com/bytecodealliance/wasmtime/tree/main/crates/wasi-preview1-component-adapter"
files = ["third_party/licenses/wasmtime-LICENSE"]
artifacts = ["runtime-python", "runtime-javascript"]
covers = ["crates/eryx-runtime/libs/wasi_snapshot_preview1.reactor.wasm.zst"]

[[component]]
name = "QuickJS-ng"
version = "0.16.2"
license = "MIT"
url = "https://github.com/quickjs-ng/quickjs/tree/v0.16.2"
# Vendored by rquickjs-sys; cargo-about lists that crate's own licence, not
# the engine's.
files = ["third_party/licenses/quickjs-ng-LICENSE"]
artifacts = ["runtime-javascript"]
crate = "rquickjs-sys"
crate_version = "0.14.0"

# The npm packages vendored into the JavaScript guest's Node compatibility
# modules (crates/eryx-guest-js/src/node/, regenerated by its regen.sh).

[[component]]
name = "buffer"
version = "6.0.3"
license = "MIT"
url = "https://github.com/feross/buffer"
files = ["crates/eryx-guest-js/src/node/licenses/buffer-LICENSE"]
artifacts = ["runtime-javascript"]
npm = "buffer"

[[component]]
name = "base64-js"
version = "1.5.1"
license = "MIT"
url = "https://github.com/beatgammit/base64-js"
files = ["crates/eryx-guest-js/src/node/licenses/base64-js-LICENSE"]
artifacts = ["runtime-javascript"]
npm = "base64-js"

[[component]]
name = "ieee754"
version = "1.2.1"
license = "BSD-3-Clause"
url = "https://github.com/feross/ieee754"
files = ["crates/eryx-guest-js/src/node/licenses/ieee754-LICENSE"]
artifacts = ["runtime-javascript"]
npm = "ieee754"

[[component]]
name = "events"
version = "3.3.0"
license = "MIT"
url = "https://github.com/browserify/events"
files = ["crates/eryx-guest-js/src/node/licenses/events-LICENSE"]
artifacts = ["runtime-javascript"]
npm = "events"

[[component]]
name = "path-browserify"
version = "1.0.1"
license = "MIT"
url = "https://github.com/browserify/path-browserify"
files = ["crates/eryx-guest-js/src/node/licenses/path-browserify-LICENSE"]
artifacts = ["runtime-javascript"]
npm = "path-browserify"

[[component]]
name = "string_decoder"
version = "1.3.0"
license = "MIT"
url = "https://github.com/nodejs/string_decoder"
files = ["crates/eryx-guest-js/src/node/licenses/string_decoder-LICENSE"]
artifacts = ["runtime-javascript"]
npm = "string_decoder"

[[component]]
name = "safe-buffer"
version = "5.2.1"
license = "MIT"
url = "https://github.com/feross/safe-buffer"
files = ["crates/eryx-guest-js/src/node/licenses/safe-buffer-LICENSE"]
artifacts = ["runtime-javascript"]
npm = "safe-buffer"

[[component]]
name = "uutils coreutils"
version = "0.9.0 (840c36d3)"
license = "MIT"
url = "https://github.com/uutils/coreutils/tree/840c36d3964833e1dc107fcb9ade9c0ad63076c0"
# The tool itself; the crates it's built from are listed when eryx-build
# builds it (#837 step 2).
files = ["third_party/licenses/uutils-coreutils-LICENSE"]
artifacts = ["coreutils"]
cli = "clis/coreutils.toml"
cli_commit = "840c36d3964833e1dc107fcb9ade9c0ad63076c0"

[[component]]
name = "aws-lc-sys (full LICENSE)"
version = "0.47.0"
license = "ISC AND (Apache-2.0 OR ISC) AND OpenSSL"
url = "https://github.com/aws/aws-lc-rs/tree/main/aws-lc-sys"
# Its LICENSE verbatim, including the OpenSSL and SSLeay notices, which ask
# to be reproduced; cargo-about only renders the SPDX licences it reports.
files = ["third_party/licenses/aws-lc-sys-LICENSE"]
artifacts = ["host"]
crate = "aws-lc-sys"
crate_version = "0.47.0"
