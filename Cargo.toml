[workspace]
resolver = "2"
members = ["crates/*"]

# Dev tools (install via cargo or mise):
# - cargo-nextest: Fast test runner (`cargo nextest run`)

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eryx-org/eryx"
authors = ["Ben Sully <ben.sully88@gmail.com>"]

[workspace.dependencies]
# Sorted alphabetically by `cargo rail unify`, which sorts unconditionally
# since 0.21 (the unify.sort_dependencies opt-out is gone). Purpose notes
# therefore ride on the dependency itself rather than sitting above a block
# — a header only stays true until the next dependency sorts underneath it.
# Self-explanatory crates are left unannotated.
anyhow = "1.0"
async-trait = "0.1"
blake3 = "1.8"
clap = { version = "^4.5.57", features = ["derive"] } #unified
criterion = { version = "0.8", features = ["async_tokio"] } # benchmarking
crossterm = "0.29"                                          # terminal control
dashmap = "6"                                               # concurrent maps
eryx = { path = "crates/eryx", version = "^0.5.0" }
eryx-macros = { path = "crates/eryx-macros", version = "^0.5.0" }
eryx-runtime = { path = "crates/eryx-runtime", version = "^0.5.0" } #unified
eryx-vfs = { path = "crates/eryx-vfs", version = "^0.5.0" } #unified
flate2 = "1.0"
futures = "0.3"
futures-concurrency = "7.6"
futures-lite = "2.6"
hex = "0.4"
hmac = "0.13"
js-sys = "0.3"          # browser WASM bindings
lending-stream = "1.0"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.1", default-features = false, features = ["http-listener"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.32"
prost = "0.14"          # gRPC (with tonic)
pyo3 = { version = "^0.29.0", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29"
rand = "0.10"           # secret placeholder generation
rcgen = "0.14"          # test certificate generation
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rmcp = "3.0"            # Model Context Protocol SDK
rustls = "0.23"
rustls-pemfile = "2.0"
schemars = "1.0.0-alpha.17" # JSON Schema
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-error = "0.2"
tracing-opentelemetry = "0.33"
uuid = "1"
walkdir = "2.5"
wasm-bindgen = "0.2"    # browser WASM bindings
wasm-encoder = "0.243"
wasmparser = "0.243"
# wasmtime v40+ required for the async component model.
# 44.0.2 patches GHSA-2r75-cxrj-cmph (WASI path_open TRUNCATE bypasses FilePerms::WRITE).
wasmtime = { version = "44.0.2", features = ["component-model", "async"] }
wasmtime-wasi = "44.0.2"
wasmtime-wasi-io = "44.0.2"
wasmtime-wizer = { version = "44.0.2", features = ["component-model", "wasmtime"] }
webpki-roots = "1.0"   # TLS trust roots
wit-component = "0.243"
wit-dylib = "0.243"
# wit-dylib FFI for implementing the interpreter interface (inlined from wasm-tools).
wit-dylib-ffi = { path = "crates/wit-dylib-ffi" }
wit-parser = "0.243"
zip = "2.0"
zstd = "0.13"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
# Priority -1 ensures this lint group is applied before individual lints,
# avoiding clippy::lint_groups_priority warning about ambiguous ordering.
rust_2018_idioms = { level = "warn", priority = -1 }
# Note: unsafe_code lint is handled per-crate in lib.rs, not at workspace level.
# The eryx crate uses `forbid(unsafe_code)` by default, relaxed to `deny` when
# the `embedded` feature is enabled.

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

# See https://nnethercote.github.io/perf-book/build-configuration.html
[profile.release]
codegen-units = 1
lto = false

[profile.profiling]
inherits = "release"
debug = true

# Optimize heavy deps in dev mode to speed up tests
# (wasmtime/cranelift JIT is ~10-50x slower unoptimized)
[profile.dev.package]
cranelift-codegen.opt-level = 3
regalloc2.opt-level = 3
wasmtime.opt-level = 3
wasmparser.opt-level = 3
# wasmtime-wizer's snapshot_component() debug-asserts that its output is valid,
# but it strips _initialize exports that the component model still references.
# Our restore_initialize_exports() post-processing fixes this, but runs after
# the assertion. Disable debug assertions for this dep since the final output
# is valid.
wasmtime-wizer.debug-assertions = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
