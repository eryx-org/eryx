# Build manifest for uutils coreutils as a multicall WASI (wasip2) component,
# via the Rust lane. Built by `mise run build-cli -- coreutils`.
#
# The one component is a multicall binary: registered under each util name
# (head, cat, …), the host sets argv[0]=<name> so it dispatches to that util.
# A precompiled cwasm matters: loading the .wasm recompiles the ~5MB module on
# every spawn (~141ms vs ~8ms for the cwasm). The host must treat wasi:cli/exit
# as a normal exit, since uutils calls exit().
#
# `mkdir -p` and canonicalizing `realpath`/`readlink -f` walk up from `/`,
# which the shell's read-only root makes statable (#832). Children see it
# with `unstable-vfs`; without it they have no filesystem until #812.

name = "coreutils"
description = "uutils coreutils (Rust, wasip2, multicall)"
# SPDX expression for the upstream source, recorded in provenance.json.
license = "MIT"
lang = "rust"

[source]
repo = "https://github.com/uutils/coreutils.git"
ref = "0.9.0"
commit = "840c36d3964833e1dc107fcb9ade9c0ad63076c0"
# Local working copy the driver builds from; fetched on first build.
dir = "scratch/uutils"

[build]
# Multicall binary; the artifact is coreutils.wasm.
bin = "coreutils"
# uucore uses unstable std::os::wasi on wasip2 — add #![feature(wasip2)].
vendor_patch = "clis/patches/patch-uucore-wasip2.sh"
# The utils that replace the shell builtins, plus common script tools (#897).
# Keep the set tight: each util can pull wasi-incompatible deps, and every
# one grows the embedded cwasm. nl and expr (regex, ~2.8 and ~1.4 MB) and
# sha256sum/md5sum (~1.3 MB together) are left out for size; chmod, df, du,
# env, id, stat, tac, test, timeout, whoami and yes don't build for wasip2,
# and ln can't work: the VFS refuses links and symlinks.
# Must match COREUTILS_TOOLS in crates/eryx/src/embedded.rs (a test checks).
cargo_flags = [
    "--no-default-features",
    "--features",
    "cat,head,tail,ls,wc,cp,mv,rm,mkdir,touch,sort,seq,cut,tr,uniq,basename,dirname,tee,sleep,paste,comm,date,base64,realpath,readlink,rmdir",
]
# Let the pinned stable toolchain use the unstable wasip2 feature.
[build.env]
RUSTC_BOOTSTRAP = "1"

[cwasm]
# Precompile to cwasm: mandatory for acceptable per-spawn cost. The flags match
# the eryx engine, which enables component-model async. This cwasm comes from
# the mise-pinned wasmtime CLI and only proves the lane; eryx will load
# commands precompiled with its own engine config and version stamp (#809).
enabled = true
flags = ["-W", "component-model-async"]

[output]
dir = "scratch/coreutils-component"
