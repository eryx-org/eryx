# actionlint configuration: https://github.com/rhysd/actionlint/blob/main/docs/config.md
self-hosted-runner:
  # These are GitHub-hosted runners, not self-hosted ones. actionlint's
  # built-in label list doesn't include them yet (as of 1.7.12), so it
  # flags them as unknown. Drop each one once actionlint learns about it.
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm

paths:
  # Generated by `dist generate`, and its plan job fails if the file differs
  # from what dist would produce, so shellcheck findings in it can't be fixed
  # here. The workflow-level checks still apply.
  .github/workflows/eryx-precompile-release.yml:
    ignore:
      - 'shellcheck reported issue in this script'
