name: "Setup Rust Environment"
description: "Install cargo-binstall, mise, and Rust toolchain"

runs:
  using: "composite"
  steps:
    # mise's cargo backend uses cargo-binstall when it is on PATH, so the
    # cargo:* tools in mise.toml download prebuilt binaries instead of
    # compiling from source.
    - uses: ./.github/actions/setup-binstall

    - name: Install mise
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        # Pinned for reproducibility: mise-action installs the latest mise by
        # default, and an auto-upgrade to 2026.8.2 broke CI (its new aube
        # supply-chain trust gate rejected a jco transitive dep). See the
        # trust_policy_excludes note in js/mise.toml. Bump deliberately.
        version: 2026.10.19
        cache: false # We handle caching ourselves to include ~/.rustup
