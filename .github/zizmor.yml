# zizmor configuration: https://docs.zizmor.sh/configuration/
rules:
  # GitHub's `uses: $/...` self-repository syntax is too new for actionlint
  # (rhysd/actionlint#745), which rejects it outright. Every local action here
  # runs straight after a fresh checkout, with nothing in between that could
  # rewrite .github/actions. Revisit once actionlint supports it.
  self-repository:
    disable: true

  # eryx-precompile-release.yml is generated by `dist generate`, and its plan
  # job fails if the file differs from what dist would produce, so findings in
  # it can only be fixed upstream or through dist-workspace.toml (which is how
  # its actions are SHA-pinned). The template expansions there take tag names,
  # which only maintainers can push, and the matrix container is null for every
  # target we build.
  excessive-permissions:
    ignore:
      - eryx-precompile-release.yml
  template-injection:
    ignore:
      - eryx-precompile-release.yml
  unpinned-images:
    ignore:
      - eryx-precompile-release.yml
