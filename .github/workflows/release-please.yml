# Release PRs for packages release-plz can't handle, because they aren't
# Cargo crates: for now eryx-run, the hosted Python client (sdk/python).
#
# On each push to main, release-please opens or updates a PR that bumps the
# version (pyproject.toml, __init__.py, uv.lock) and changelog from the
# conventional commits touching sdk/python since the last release. Merging that
# PR tags `eryx-run-python-v<version>` and publishes a GitHub release, which
# runs python-sdk-release.yml to publish to PyPI. Config:
# release-please-config.json and .release-please-manifest.json.

name: Release-please

permissions: {}

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Release-please
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'eryx-org' }}
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # The release-plz app's token, not GITHUB_TOKEN: a release published
      # with GITHUB_TOKEN wouldn't trigger python-sdk-release.yml
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
