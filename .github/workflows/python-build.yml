  # Build wheels for macOS ARM (native build with precompile)
  macos-aarch64:
    name: macOS (aarch64)
    runs-on: macos-26
    # The JavaScript and shell cwasms the tests load.
    needs: [runtime, companion-wheels]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
