        with:
          pattern: runtime-cwasm-*
          merge-multiple: true
          path: cwasm

      - name: Install the JavaScript and shell runtimes for the tests
        shell: bash
        run: |
          for lang in javascript shell; do
            cp "cwasm/runtime-$lang-x86_64-apple-darwin.cwasm" "crates/eryx-runtime/runtime-$lang.cwasm"
          done

      - name: Test wheel
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install ./sdk/python  # pyeryx's eryx-run, as in this commit
          uv pip install dist/*.whl --force-reinstall
          cd crates/eryx-python && uv export --extra dev --no-dev --no-hashes --no-emit-project --frozen | uv pip install -r - && cd ../..
          pytest crates/eryx-python/tests/ -v

  # Build wheels for Windows
  windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    # The JavaScript and shell cwasms the tests load.
    needs: [runtime, companion-wheels]
    strategy:
      fail-fast: false
      matrix:
        target:
          - x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Verify artifacts
        shell: bash
        run: |
          echo "=== Checking downloaded artifacts ==="
          ls -la crates/eryx-runtime/
          ls -la crates/eryx-runtime/prebuilt/ || echo "prebuilt dir missing!"

          # Verify required files exist
          test -f crates/eryx-runtime/runtime-python.wasm || (echo "runtime-python.wasm missing!" && exit 1)
          test -f crates/eryx-runtime/prebuilt/liberyx_runtime.so.zst || (echo "liberyx_runtime.so.zst missing!" && exit 1)
          test -f crates/eryx-runtime/prebuilt/liberyx_bindings.so.zst || (echo "liberyx_bindings.so.zst missing!" && exit 1)

          # Touch to mark as up-to-date
          touch crates/eryx-runtime/runtime-python.wasm
          touch crates/eryx-runtime/prebuilt/*

          echo "=== All artifacts verified ==="

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Pre-compile WASM for this platform (with Python pre-init)
        shell: bash
        run: |
          echo "Pre-compiling WASM for Windows x64 with Python pre-initialization..."
          cargo run -p eryx --example precompile --features preinit --release
          ls -la crates/eryx-runtime/runtime-python.cwasm
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"
          ERYX_CPU_FEATURES: "x86-64-v2"

      - name: Mark cwasm as up-to-date
        shell: bash
        run: touch crates/eryx-runtime/runtime-python.cwasm

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/eryx-python/Cargo.toml

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

      - name: Download the JavaScript and shell runtimes for the tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-cwasm-*
          merge-multiple: true
          path: cwasm

      - name: Install the JavaScript and shell runtimes for the tests
        shell: bash
        run: |
          for lang in javascript shell; do
            cp "cwasm/runtime-$lang-x86_64-pc-windows-msvc.cwasm" "crates/eryx-runtime/runtime-$lang.cwasm"
          done

      - name: Test wheel
        shell: bash
        run: |
          uv venv
          source .venv/Scripts/activate
          uv pip install ./sdk/python  # pyeryx's eryx-run, as in this commit
          uv pip install dist/*.whl --force-reinstall
          cd crates/eryx-python && uv export --extra dev --no-dev --no-hashes --no-emit-project --frozen | uv pip install -r - && cd ../..
          pytest crates/eryx-python/tests/ -v

  # Build source distribution
  sdist:
    name: Source Distribution
    runs-on: ubuntu-latest
    needs: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path crates/eryx-python/Cargo.toml

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  # The JavaScript and shell runtimes ship as companion packages, not in the
  # pyeryx wheel. Their cwasms are cross-compiled here for every platform with
  # the `precompile` example, as ci.yml's build-runtime-* jobs do (the
  # eryx-precompile binary has no aarch64 backend), then each is packaged as a
  # `py3-none-<platform>` wheel for that platform's pyeryx wheel tag.
  companion-wheels:
    name: Companion wheels (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, shell]
    env:
      RUNTIME_LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download runtime assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-assets
          path: crates/eryx-runtime/

      - uses: ./.github/actions/setup-rust

      - name: Precompile for each platform
        run: |
          mkdir -p cwasm
          # `preinit` is what lets the example apply ERYX_CPU_FEATURES; it only
          # pre-initializes Python. Portable CPU features: x86-64-v2 on x86_64,
          # and "baseline" on aarch64, which has no psABI presets.
          compile() {
            ERYX_CPU_FEATURES="$1" cargo run -p eryx --example precompile --features preinit --release -- \
              --target "$2" --output "cwasm/runtime-$RUNTIME_LANGUAGE-$2.cwasm"
          }
          compile_all() {
            compile x86-64-v2 x86_64-unknown-linux-gnu
            compile baseline aarch64-unknown-linux-gnu
            compile x86-64-v2 x86_64-apple-darwin
            compile baseline aarch64-apple-darwin
            compile x86-64-v2 x86_64-pc-windows-msvc
          }
          export ERYX_WASM_PATH="crates/eryx-runtime/runtime-$RUNTIME_LANGUAGE.wasm" ERYX_LANGUAGE="$RUNTIME_LANGUAGE"
          compile_all
          # The shell's default commands, uutils coreutils (from the runtime
          # assets' coreutils.wasm), precompiled as a command for each platform
          # and shipped beside the runtime.
          if [ "$RUNTIME_LANGUAGE" = shell ]; then
            compile() {
              ERYX_CPU_FEATURES="$1" cargo run -p eryx --example precompile --features preinit --release -- \
                --target "$2" --output "cwasm/coreutils-$2.cwasm"
            }
            export ERYX_WASM_PATH=crates/eryx-runtime/coreutils.wasm ERYX_LANGUAGE=command
            compile_all
          fi
          ls -la cwasm/
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.12"

      # One wheel per pyeryx platform tag. musllinux reuses the gnu cwasm, as
      # the Python runtime in the musllinux pyeryx wheels does. setuptools tags
      # the wheel for the build host (`linux_x86_64`, which PyPI rejects), so
      # each is retagged for its platform.
      - name: Build wheels
        run: |
          pkg="crates/eryx-python/runtimes/$RUNTIME_LANGUAGE"
          dest="$pkg/pyeryx_runtime_$RUNTIME_LANGUAGE/runtime-$RUNTIME_LANGUAGE.cwasm"
          mkdir -p dist
          while read -r target tag; do
            cwasm="cwasm/runtime-$RUNTIME_LANGUAGE-$target.cwasm"
            cp "$cwasm" "$dest"
            coreutils="cwasm/coreutils-$target.cwasm"
            if [ "$RUNTIME_LANGUAGE" = shell ]; then
              cp "$coreutils" "$pkg/pyeryx_runtime_shell/coreutils.cwasm"
            fi
            # setuptools reuses build/, which would keep the previous cwasm.
            rm -rf "$pkg/build" "$pkg"/*.egg-info "$RUNNER_TEMP/wheel"
            uv build --wheel --out-dir "$RUNNER_TEMP/wheel" "$pkg"
            uvx --from wheel==0.45.1 wheel tags --remove --platform-tag "$tag" "$RUNNER_TEMP"/wheel/*.whl
            wheel=$(ls "$RUNNER_TEMP"/wheel/*.whl)
            # The wheel must hold this platform's cwasm, byte for byte.
            unzip -p "$wheel" "pyeryx_runtime_$RUNTIME_LANGUAGE/runtime-$RUNTIME_LANGUAGE.cwasm" | cmp - "$cwasm"
            if [ "$RUNTIME_LANGUAGE" = shell ]; then
              unzip -p "$wheel" pyeryx_runtime_shell/coreutils.cwasm | cmp - "$coreutils"
            fi
            mv "$wheel" dist/
          done <<'EOF'
          x86_64-unknown-linux-gnu manylinux_2_17_x86_64.manylinux2014_x86_64
          x86_64-unknown-linux-gnu musllinux_1_2_x86_64
          aarch64-unknown-linux-gnu manylinux_2_17_aarch64.manylinux2014_aarch64
          aarch64-unknown-linux-gnu musllinux_1_2_aarch64
          x86_64-apple-darwin macosx_10_12_x86_64
          aarch64-apple-darwin macosx_11_0_arm64
          x86_64-pc-windows-msvc win_amd64
          EOF
          ls -la dist/

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-runtime-${{ matrix.language }}
          path: dist
          if-no-files-found: error

      # For the pyeryx wheel jobs' tests (tests/test_languages.py).
      - name: Upload cwasms
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-cwasm-${{ matrix.language }}
          path: cwasm
          if-no-files-found: error
          retention-days: 1

  # Install pyeryx[all] from this run's own wheels on each OS family and run
  # the JavaScript and shell guests, so a companion wheel that doesn't load on
  # its platform fails the release before anything is published.
  smoke-test:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [linux-x86_64, macos-aarch64, windows, companion-wheels]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Install pyeryx[all] and run each language
        shell: bash
        run: |
          uv venv
          uv pip install ./sdk/python  # pyeryx's eryx-run, as in this commit
          # Only this run's wheels: never a published pyeryx or companion.
          uv pip install --no-index --no-build --find-links dist "pyeryx[all]"
          python=.venv/bin/python
          [ -x "$python" ] || python=.venv/Scripts/python
          "$python" - <<'EOF'
          import eryx

          checks = [
              ("python", "print(6 * 7)"),
              ("javascript", "console.log(6 * 7)"),
              ("shell", "echo $((6 * 7))"),
              # The companion's coreutils are the shell's default commands.
              ("shell", "echo 42 | cat"),
          ]
          for language, code in checks:
              stdout = eryx.Sandbox(language=language).execute(code).stdout
              print(language, stdout)
              assert stdout == b"42\n", (language, stdout)
          EOF

