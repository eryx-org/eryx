# Build every wheel a pyeryx release publishes, and test them.
#
# Called by python-release.yml (which then publishes) and the release dry
# run; it publishes nothing. Uploads `wheels-*` artifacts:
# - pyeryx for each platform, with the Python runtime precompiled and
#   embedded (the wheel stays Python-only), plus the sdist;
# - the companion packages pyeryx-runtime-javascript and pyeryx-runtime-shell,
#   one `py3-none-<platform>` wheel per pyeryx platform, each holding that
#   platform's precompiled runtime-<language>.cwasm. Their versions are
#   locked to pyeryx's (scripts/sync-runtime-versions.sh).

name: Build Python Wheels

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# No GitHub Actions caches anywhere in this workflow (no rust-cache, uv or mise
# caching). Everything here ships to users, and a cache entry written by any
# earlier run on main is restored as-is, so a poisoned entry would flow
# straight into the published wheels. Release builds are slower for it, and
# rare enough that it does not matter. See zizmor's cache-poisoning audit.

jobs:
  runtime:
    name: Runtimes
    uses: ./.github/workflows/runtime-build.yml

  # Build wheels for Linux x86_64 (native build with precompile)
  linux-x86_64:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    # The JavaScript and shell cwasms the tests load.
    needs: [runtime, companion-wheels]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Verify artifacts
        run: |
          echo "=== Checking downloaded artifacts ==="
          ls -la crates/eryx-runtime/
          ls -la crates/eryx-runtime/prebuilt/ || echo "prebuilt dir missing!"

          # Verify required files exist
          test -f crates/eryx-runtime/runtime-python.wasm || (echo "runtime-python.wasm missing!" && exit 1)
          test -f crates/eryx-runtime/prebuilt/liberyx_runtime.so.zst || (echo "liberyx_runtime.so.zst missing!" && exit 1)
          test -f crates/eryx-runtime/prebuilt/liberyx_bindings.so.zst || (echo "liberyx_bindings.so.zst missing!" && exit 1)

          # Touch to mark as up-to-date
          touch crates/eryx-runtime/runtime-python.wasm
          touch crates/eryx-runtime/prebuilt/*

          echo "=== All artifacts verified ==="

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Pre-compile WASM for this platform (with Python pre-init)
        run: |
          echo "Pre-compiling WASM for Linux x86_64 with Python pre-initialization..."
          cargo run -p eryx --example precompile --features preinit --release
          ls -la crates/eryx-runtime/runtime-python.cwasm
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"
          ERYX_CPU_FEATURES: "x86-64-v2"

      - name: Mark cwasm as up-to-date
        run: touch crates/eryx-runtime/runtime-python.cwasm

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          args: --release --out dist --manifest-path crates/eryx-python/Cargo.toml
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Download the JavaScript and shell runtimes for the tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-cwasm-*
          merge-multiple: true
          path: cwasm

      - name: Install the JavaScript and shell runtimes for the tests
        shell: bash
        run: |
          for lang in javascript shell; do
            cp "cwasm/runtime-$lang-x86_64-unknown-linux-gnu.cwasm" "crates/eryx-runtime/runtime-$lang.cwasm"
          done

      - name: Test wheel
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install ./sdk/python  # pyeryx's eryx-run, as in this commit
          uv pip install dist/*.whl --force-reinstall
          cd crates/eryx-python && uv export --extra dev --no-dev --no-hashes --no-emit-project --frozen | uv pip install -r - && cd ../..
          pytest crates/eryx-python/tests/ -v

  # Build wheels for Linux musllinux x86_64 (for Alpine Linux)
  musllinux-x86_64:
    name: Linux musllinux (x86_64)
    runs-on: ubuntu-latest
    # The JavaScript and shell cwasms the tests load.
    needs: [runtime, companion-wheels]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Verify artifacts
        run: |
          echo "=== Checking downloaded artifacts ==="
          ls -la crates/eryx-runtime/
          ls -la crates/eryx-runtime/prebuilt/ || echo "prebuilt dir missing!"

          # Verify required files exist
          test -f crates/eryx-runtime/runtime-python.wasm || (echo "runtime-python.wasm missing!" && exit 1)
          test -f crates/eryx-runtime/prebuilt/liberyx_runtime.so.zst || (echo "liberyx_runtime.so.zst missing!" && exit 1)
          test -f crates/eryx-runtime/prebuilt/liberyx_bindings.so.zst || (echo "liberyx_bindings.so.zst missing!" && exit 1)

          # Touch to mark as up-to-date
          touch crates/eryx-runtime/runtime-python.wasm
          touch crates/eryx-runtime/prebuilt/*

          echo "=== All artifacts verified ==="

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Pre-compile WASM for this platform (with Python pre-init)
        run: |
          echo "Pre-compiling WASM for Linux x86_64 with Python pre-initialization..."
          cargo run -p eryx --example precompile --features preinit --release
          ls -la crates/eryx-runtime/runtime-python.cwasm
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"
          ERYX_CPU_FEATURES: "x86-64-v2"

      - name: Mark cwasm as up-to-date
        run: touch crates/eryx-runtime/runtime-python.cwasm

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          args: --release --out dist --manifest-path crates/eryx-python/Cargo.toml
          manylinux: musllinux_1_2

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-musllinux-x86_64
          path: dist

      - name: Download the JavaScript and shell runtimes for the tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-cwasm-*
          merge-multiple: true
          path: cwasm

      - name: Install the JavaScript and shell runtimes for the tests
        shell: bash
        run: |
          for lang in javascript shell; do
            cp "cwasm/runtime-$lang-x86_64-unknown-linux-gnu.cwasm" "crates/eryx-runtime/runtime-$lang.cwasm"
          done

      - name: Test wheel
        run: |
          # The whole checkout, so tests/test_languages.py finds the runtimes
          # in crates/eryx-runtime/ (and fails, with CI set, if they're missing).
          # This job's wheel, and pyeryx's eryx-run as in this commit (as the
          # other jobs install), never the published ones.
          docker run --rm -e CI \
            -v "$(pwd):/src" \
            python:3.12-alpine sh -c "
              pip install /src/sdk/python &&
              pip install \"\$(echo /src/dist/pyeryx-*.whl)[dev]\" &&
              pytest -p no:cacheprovider /src/crates/eryx-python/tests/ -v
            "

  # Build wheels for Linux aarch64 (native ARM build with precompile)
  linux-aarch64:
    name: Linux (aarch64)
    runs-on: ubuntu-26.04-arm
    # The JavaScript and shell cwasms the tests load.
    needs: [runtime, companion-wheels]
