          manylinux: musllinux_1_2

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-musllinux-aarch64
          path: dist

      - name: Test wheel
        run: |
          docker run --rm \
            -v "$(pwd)/dist:/dist" \
            -v "$(pwd)/crates/eryx-python/tests:/tests" \
