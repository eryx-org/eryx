  # Build wheels for Windows
  windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    needs: build-runtime
    strategy:
      fail-fast: false
      matrix:
        target:
          - x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
