          # Touch to mark as up-to-date
          touch crates/eryx-runtime/runtime.wasm
          touch crates/eryx-runtime/prebuilt/*

          echo "=== All artifacts verified ==="

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Pre-compile WASM for this platform (with Python pre-init)
        shell: bash
        run: |
          echo "Pre-compiling WASM for Windows x64 with Python pre-initialization..."
          cargo run -p eryx --example precompile --features preinit --release
          ls -la crates/eryx-runtime/runtime.cwasm
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"
          ERYX_CPU_FEATURES: "x86-64-v2"

      - name: Mark cwasm as up-to-date
        shell: bash
        run: touch crates/eryx-runtime/runtime.cwasm

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/eryx-python/Cargo.toml

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

      - name: Test wheel
        shell: bash
        run: |
          uv venv
          source .venv/Scripts/activate
          uv pip install dist/*.whl --force-reinstall
          cd crates/eryx-python && uv export --extra dev --no-dev --no-hashes --no-emit-project --frozen | uv pip install -r - && cd ../..
          pytest crates/eryx-python/tests/ -v

  # Build source distribution
  sdist:
    name: Source Distribution
    runs-on: ubuntu-latest
    needs: build-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path crates/eryx-python/Cargo.toml

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  # Publish to PyPI
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs:
      [linux-x86_64, musllinux-x86_64, linux-aarch64, musllinux-aarch64, macos-aarch64, macos-x86_64, windows, sdist]
    environment: pypi
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List wheels
        run: ls -la dist/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
