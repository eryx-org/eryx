# Python wheel release workflow for eryx-python
#
# This workflow publishes the wheels python-build.yml builds: pyeryx for
# multiple platforms, and the pyeryx-runtime-javascript and
# pyeryx-runtime-shell companion wheels.
# It runs on:
# - GitHub Release published (filtered to eryx-v* tags, triggered by release-plz)
# - Manual workflow dispatch

name: Python Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# No GitHub Actions caches anywhere in this workflow (no rust-cache, uv or mise
# caching). Everything here ships to users, and a cache entry written by any
# earlier run on main is restored as-is, so a poisoned entry would flow
# straight into the published wheels. Release builds are slower for it, and
# rare enough that it does not matter. See zizmor's cache-poisoning audit.

jobs:
  build:
    name: Build
    # Only run for the main eryx crate release, not the other crates.
    #
    # `startsWith(tag, 'eryx-v')` alone is NOT enough: release-plz tags are
    # `{crate}-v{version}`, and "eryx-vfs-v0.6.0" starts with "eryx-v" too, so
    # eryx-vfs releases were also triggering this. The other crates happen not to
    # collide (eryx-macros, eryx-precompile, eryx-runtime), but any future crate
    # whose name starts with "v" after the dash would need excluding here as well.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.release.tag_name, 'eryx-v') &&
       !startsWith(github.event.release.tag_name, 'eryx-vfs-v'))
    uses: ./.github/workflows/python-build.yml

  # Publish to PyPI
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    environment: pypi
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List wheels
        run: ls -la dist/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
