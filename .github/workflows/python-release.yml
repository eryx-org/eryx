          echo "=== Checking downloaded artifacts ==="
          ls -la crates/eryx-runtime/
          ls -la crates/eryx-runtime/prebuilt/ || echo "prebuilt dir missing!"

          # Verify required files exist
          test -f crates/eryx-runtime/runtime.wasm || (echo "runtime.wasm missing!" && exit 1)
          test -f crates/eryx-runtime/prebuilt/liberyx_runtime.so.zst || (echo "liberyx_runtime.so.zst missing!" && exit 1)
          test -f crates/eryx-runtime/prebuilt/liberyx_bindings.so.zst || (echo "liberyx_bindings.so.zst missing!" && exit 1)

          # Touch to mark as up-to-date
          touch crates/eryx-runtime/runtime.wasm
          touch crates/eryx-runtime/prebuilt/*

          echo "=== All artifacts verified ==="

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Pre-compile WASM for this platform (with Python pre-init)
        run: |
          echo "Pre-compiling WASM for Linux aarch64 with Python pre-initialization..."
          cargo run -p eryx --example precompile --features preinit --release
          ls -la crates/eryx-runtime/runtime.cwasm
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"
          # aarch64 has no Cranelift psABI presets, so "baseline" (pin the
          # target, enable nothing) is the only setting that does not bake this
          # runner's CPU into the wheel. Without it the default is native, and a
          # runner refresh to ARMv8.6 hardware would emit has_i8mm and break
          # every M1. Costs LSE atomics, FP16, dotprod and I8MM.
          ERYX_CPU_FEATURES: "baseline"

      - name: Mark cwasm as up-to-date
        run: touch crates/eryx-runtime/runtime.cwasm

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: aarch64
          args: --release --out dist --manifest-path crates/eryx-python/Cargo.toml
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-aarch64
          path: dist

      - name: Test wheel
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install dist/*.whl --force-reinstall
          cd crates/eryx-python && uv export --extra dev --no-dev --no-hashes --no-emit-project --frozen | uv pip install -r - && cd ../..
          pytest crates/eryx-python/tests/ -v

  # Build wheels for Linux musllinux aarch64 (for Alpine Linux on ARM)
  musllinux-aarch64:
    name: Linux musllinux (aarch64)
    runs-on: ubuntu-26.04-arm
