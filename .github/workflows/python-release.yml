# Python wheel release workflow for eryx-python
#
# This workflow builds and publishes Python wheels for multiple platforms.
# It runs on:
# - GitHub Release published (filtered to eryx-v* tags, triggered by release-plz)
# - Manual workflow dispatch

name: Python Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# No GitHub Actions caches anywhere in this workflow (no rust-cache, uv or mise
# caching). Everything here ships to users, and a cache entry written by any
# earlier run on main is restored as-is, so a poisoned entry would flow
# straight into the published wheels. Release builds are slower for it, and
# rare enough that it does not matter. See zizmor's cache-poisoning audit.

jobs:
  # Build the WASM runtime first - required for all wheel builds
  # This produces platform-independent artifacts only
  build-runtime:
    name: Build Runtime
    runs-on: ubuntu-latest
    # Only run for the main eryx crate release, not the other crates.
    #
    # `startsWith(tag, 'eryx-v')` alone is NOT enough: release-plz tags are
    # `{crate}-v{version}`, and "eryx-vfs-v0.6.0" starts with "eryx-v" too, so
    # eryx-vfs releases were also triggering this. The other crates happen not to
    # collide (eryx-macros, eryx-precompile, eryx-runtime), but any future crate
    # whose name starts with "v" after the dash would need excluding here as well.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.release.tag_name, 'eryx-v') &&
       !startsWith(github.event.release.tag_name, 'eryx-vfs-v'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install nightly toolchain
        run: rustup toolchain install nightly --component rust-src

      - name: Install mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: false

      - name: Build eryx-runtime
        run: mise run build-eryx-runtime

      # Extract Python stdlib for pre-initialization
      # This is needed so each platform can pre-initialize Python when precompiling
      - name: Extract Python stdlib
        run: mise run setup-eryx-runtime-tests

      # NOTE: We do NOT precompile here - each platform job will precompile
      # for its target architecture. The .cwasm file is NOT portable across
      # platforms/architectures.

      - name: Copy prebuilt late-linking artifacts
        run: |
          OUT_DIR=$(find target/release -path "*/eryx-runtime-*/out" -type d | head -1)
          mkdir -p crates/eryx-runtime/prebuilt
          cp "$OUT_DIR/liberyx_runtime.so.zst" crates/eryx-runtime/prebuilt/
          cp "$OUT_DIR/liberyx_bindings.so.zst" crates/eryx-runtime/prebuilt/

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-runtime
          path: |
            crates/eryx-runtime/runtime.wasm
            crates/eryx-runtime/prebuilt/
            crates/eryx-wasm-runtime/tests/python-stdlib/
          retention-days: 1

  # Build wheels for Linux x86_64 (native build with precompile)
  linux-x86_64:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    needs: build-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Verify artifacts
        run: |
          echo "=== Checking downloaded artifacts ==="
          ls -la crates/eryx-runtime/
          ls -la crates/eryx-runtime/prebuilt/ || echo "prebuilt dir missing!"

          # Verify required files exist
          test -f crates/eryx-runtime/runtime.wasm || (echo "runtime.wasm missing!" && exit 1)
          test -f crates/eryx-runtime/prebuilt/liberyx_runtime.so.zst || (echo "liberyx_runtime.so.zst missing!" && exit 1)
          test -f crates/eryx-runtime/prebuilt/liberyx_bindings.so.zst || (echo "liberyx_bindings.so.zst missing!" && exit 1)

          # Touch to mark as up-to-date
          touch crates/eryx-runtime/runtime.wasm
          touch crates/eryx-runtime/prebuilt/*

          echo "=== All artifacts verified ==="

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Pre-compile WASM for this platform (with Python pre-init)
        run: |
          echo "Pre-compiling WASM for Linux x86_64 with Python pre-initialization..."
          cargo run -p eryx --example precompile --features preinit --release
          ls -la crates/eryx-runtime/runtime.cwasm
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"
          ERYX_CPU_FEATURES: "x86-64-v2"

      - name: Mark cwasm as up-to-date
        run: touch crates/eryx-runtime/runtime.cwasm

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          args: --release --out dist --manifest-path crates/eryx-python/Cargo.toml
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Test wheel
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install dist/*.whl --force-reinstall
          cd crates/eryx-python && uv export --extra dev --no-dev --no-hashes --no-emit-project --frozen | uv pip install -r - && cd ../..
          pytest crates/eryx-python/tests/ -v

  # Build wheels for Linux musllinux x86_64 (for Alpine Linux)
  musllinux-x86_64:
    name: Linux musllinux (x86_64)
    runs-on: ubuntu-latest
    needs: build-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Verify artifacts
        run: |
          echo "=== Checking downloaded artifacts ==="
          ls -la crates/eryx-runtime/
          ls -la crates/eryx-runtime/prebuilt/ || echo "prebuilt dir missing!"

          # Verify required files exist
          test -f crates/eryx-runtime/runtime.wasm || (echo "runtime.wasm missing!" && exit 1)
          test -f crates/eryx-runtime/prebuilt/liberyx_runtime.so.zst || (echo "liberyx_runtime.so.zst missing!" && exit 1)
          test -f crates/eryx-runtime/prebuilt/liberyx_bindings.so.zst || (echo "liberyx_bindings.so.zst missing!" && exit 1)

          # Touch to mark as up-to-date
          touch crates/eryx-runtime/runtime.wasm
          touch crates/eryx-runtime/prebuilt/*

          echo "=== All artifacts verified ==="

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Pre-compile WASM for this platform (with Python pre-init)
        run: |
          echo "Pre-compiling WASM for Linux x86_64 with Python pre-initialization..."
          cargo run -p eryx --example precompile --features preinit --release
          ls -la crates/eryx-runtime/runtime.cwasm
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"
          ERYX_CPU_FEATURES: "x86-64-v2"

      - name: Mark cwasm as up-to-date
        run: touch crates/eryx-runtime/runtime.cwasm

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          args: --release --out dist --manifest-path crates/eryx-python/Cargo.toml
          manylinux: musllinux_1_2

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-musllinux-x86_64
          path: dist

      - name: Test wheel
        run: |
          docker run --rm \
            -v "$(pwd)/dist:/dist" \
            -v "$(pwd)/crates/eryx-python/tests:/tests" \
            python:3.12-alpine sh -c "
              pip install 'pyeryx[dev]' --find-links /dist/ --only-binary pyeryx &&
              pytest /tests/ -v
            "

  # Build wheels for Linux aarch64 (native ARM build with precompile)
  linux-aarch64:
    name: Linux (aarch64)
    runs-on: ubuntu-26.04-arm
    needs: build-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
