# Upload runtime-{python,javascript,shell}.wasm to the main eryx GitHub release,
# for `eryx-precompile setup --language`.
# Runs separately from the release workflows to avoid conflicts over the release.

name: Upload Runtime Artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build
    # Only the main eryx release gets the runtime assets. Without this the job
    # ran for all four release-plz releases, rebuilding the runtimes each time
    # and attaching them to releases that have no use for them. See the note in
    # python-release.yml for why the eryx-vfs exclusion is needed.
    if: >-
      startsWith(github.event.release.tag_name, 'eryx-v') &&
      !startsWith(github.event.release.tag_name, 'eryx-vfs-v')
    uses: ./.github/workflows/runtime-build.yml

  upload-runtime:
    name: Upload to release
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download runtime assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-assets
          path: runtime-assets

      # `eryx-precompile setup` verifies each download against its .sha256.
      - name: Upload the runtimes to the release
        working-directory: runtime-assets
        run: |
          sha256sum --check runtime-*.wasm.sha256
          gh release upload "$TAG_NAME" runtime-*.wasm runtime-*.wasm.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
