        node: ["22", "26"]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install
        run: npm ci

      # First: the examples import the package by name, which is dist/
      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  # Test book examples
  book-tests:
    name: Book Tests
    runs-on: ubuntu-latest
    needs: [changes, build-runtime-python, build-runtime-javascript, build-runtime-shell, build-bundler]
    if: >-
      needs.changes.outputs.full == 'true'
      && (github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.book == 'true'
      || needs.changes.outputs.python == 'true')
    env:
      # The release profile uses codegen-units = 1 for shipped artifacts, which
      # makes LLVM single-threaded on the eryx crate. These builds only feed
      # tests, so trade a little runtime speed for a ~2.5x faster rebuild.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Download guest runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasm-runtime-guest-*
          merge-multiple: true
          path: crates/eryx-runtime/

      - uses: ./.github/actions/mark-wasm-current

      - uses: ./.github/actions/setup-rust

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Install mdbook tools
        run: |
          cargo binstall -y mdbook
          cargo binstall -y mdbook-langtabs

      - name: Build project
        run: |
          # `mdbook test -L <dir>` points rustdoc at a whole directory instead of
          # naming artifacts, so that directory must hold exactly one copy of
          # each crate. Two separate things break that:
          #
          #  1. Cargo legitimately compiles some crates twice in one build --
          #     once for the target graph and once for the host graph (build
          #     scripts, proc macros and their dependencies), which
          #     resolver = "2" deliberately does not feature-unify. Both land in
          #     target/debug/deps and rustdoc cannot choose:
          #       error[E0464]: multiple candidates for `rlib` dependency `serde`
          #     Rust 1.97 produces two more such units than 1.92 did, which is
          #     why this surfaced on the toolchain bump and not before.
          #  2. The Rust cache is keyed per job, so artifacts from earlier runs
          #     under a different Cargo.lock linger alongside current ones.
          #
          # Building with an explicit --target fixes (1): target-side artifacts
          # go under target/<triple>/debug and the host graph stays out.
          # Assembling the link directory from cargo's own artifact list fixes
          # (2): only what this build resolved to is copied in.
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          echo "building for $TRIPLE"

          cargo clean -p eryx -p eryx-runtime --target "$TRIPLE" 2>/dev/null || true
          cargo build -p eryx --features embedded,macros --target "$TRIPLE" \
            --message-format=json-render-diagnostics \
            > "$RUNNER_TEMP/cargo-build.json"

          BOOK_DEPS=target/book-deps
          rm -rf "$BOOK_DEPS" && mkdir -p "$BOOK_DEPS"
          # Cargo reports the *root* package's rlib at its uplifted, unhashed
          # path (target/<triple>/debug/liberyx.rlib) and only its .rmeta at the
          # hashed one. rustdoc loads the hashed .rmeta and then looks for a
          # .rlib with the matching hash beside it -- the unhashed copy does not
          # satisfy it, and every example fails with
          #   error: crate `eryx` required to be available in rlib format
          # So keep only hashed artifacts, and pick up each .rmeta's sibling
          # .rlib from the same directory. That directory is deps/ before
          # Cargo 1.100 and build/<pkg>/<hash>/out/ from 1.100 on.
          jq -r 'select(.reason == "compiler-artifact") | .filenames[]?' \
            "$RUNNER_TEMP/cargo-build.json" \
            | grep "/$TRIPLE/debug/" | grep -E -- '-[0-9a-f]+\.(rlib|rmeta)$' \
            | while read -r f; do
                cp -n "$f" "$BOOK_DEPS/"
                case "$f" in
                  *.rmeta) [ -e "${f%.rmeta}.rlib" ] && cp -n "${f%.rmeta}.rlib" "$BOOK_DEPS/" || true ;;
                esac
              done

          # Proc macros are host artifacts, so --target keeps them out of the
          # target directory -- but rustdoc still needs them to expand derives,
          # or every example using one fails with
          #   error[E0463]: can't find crate for `serde_derive`
          # They are dylibs, so they cannot collide with the rlibs above.
          jq -r 'select(.reason == "compiler-artifact")
                 | select(.target.kind[]? == "proc-macro") | .filenames[]?' \
            "$RUNNER_TEMP/cargo-build.json" \
            | while read -r f; do cp -n "$f" "$BOOK_DEPS/"; done

          echo "assembled $(find "$BOOK_DEPS" -mindepth 1 -maxdepth 1 | wc -l) artifacts into $BOOK_DEPS"

      - name: Test Rust code blocks
        run: mdbook test -L ../target/book-deps
        working-directory: book

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest

      - name: Build and install eryx-python
        working-directory: crates/eryx-python
        run: |
          source ../../.venv/bin/activate
          # pyeryx depends on eryx-run: this repo's, so changes to both are
          # tested together (this job's venv has pip, not uv)
          pip install -e ../../sdk/python
          maturin develop --release

      - name: Test Python code blocks
        working-directory: book
        env:
          # Stand in for `pip install pyeryx[javascript]` (the companion
          # packages aren't published yet, #847): the book's JavaScript
          # example runs the runtime downloaded from build-runtime-javascript.
          ERYX_RUNTIME_CWASM_JAVASCRIPT: ${{ github.workspace }}/crates/eryx-runtime/runtime-javascript.cwasm
        run: |
          source ../.venv/bin/activate
          python scripts/test_examples.py

  # Deploy book to GitHub Pages (only on main)
  deploy-book:
    name: Deploy Book
    runs-on: ubuntu-latest
    needs: book-tests
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Need full history for version detection

      - uses: ./.github/actions/setup-binstall

      - name: Install mdbook tools
        run: |
          cargo binstall -y mdbook
          cargo binstall -y mdbook-langtabs

      - name: Detect version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VERSION"

      - name: Build book
        working-directory: book
        run: mdbook build

      - name: Prepare deployment directory
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p deploy/latest/book
          mkdir -p "deploy/$VERSION/book"
          cp -r book/book/* deploy/latest/book/
          cp -r book/book/* "deploy/$VERSION/book/"
          echo "docs.eryx.run" > deploy/CNAME
          cat > deploy/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Eryx Documentation</title>
            <meta http-equiv="refresh" content="0; url=latest/book/">
          </head>
          <body>
            <p>Redirecting to <a href="latest/book/">latest documentation</a>...</p>
          </body>
          </html>
          HTMLEOF

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'deploy'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Deploy browser demo to Cloudflare Pages.
  # - On main: production deployment (custom domain)
  # - On PRs: preview deployment (<branch>.eryx-demo.pages.dev)
  deploy-demo:
    name: Deploy Demo (Cloudflare)
    runs-on: ubuntu-latest
    needs: [changes, build-runtime-python, build-runtime-javascript, build-runtime-shell, build-bundler]
    if: >-
      needs.changes.outputs.full == 'true'
      && (github.event.pull_request.head.repo.fork != true
      && github.actor != 'dependabot[bot]'
      && github.ref_type != 'tag'
      && (github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.js == 'true'
      || needs.changes.outputs.demo == 'true'))
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Download guest runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasm-runtime-guest-*
          merge-multiple: true
          path: crates/eryx-runtime/

      - uses: ./.github/actions/mark-wasm-current

      - uses: ./.github/actions/setup-rust

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Install wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Build JavaScript bindings
        working-directory: js
        run: mise run build

      - name: Build linker WASM + copy base libs
        run: |
          mise run build-linker-wasm
          mise run copy-base-libs

      - name: Download example packages for demo
        working-directory: js/demo/public
        run: |
          mkdir -p examples
          curl -fSL --retry 5 --retry-all-errors -o examples/humanize-4.15.0-py3-none-any.whl \
            "https://files.pythonhosted.org/packages/c5/7b/bca5613a0c3b542420cf92bd5e5fb8ebd5435ce1011a091f66bb7693285e/humanize-4.15.0-py3-none-any.whl"
          curl -fSL --retry 5 --retry-all-errors -o examples/numpy-wasi.tar.gz \
            "https://github.com/eryx-org/eryx/releases/download/demo-assets/numpy-wasi.tar.gz"
          ls -lh examples/

      - name: Install eryx dependencies
        run: npm ci --prefix js/eryx

      - name: Build demo site
        working-directory: js/demo
        run: |
          npm install
          npx vite build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy js/demo/dist --project-name=eryx-demo --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY="🌐 **Demo preview:** $ALIAS_URL
          📌 **This deploy:** $DEPLOY_URL"
          gh pr comment "$PR_NUMBER" \
            --body "$BODY" --edit-last || \
          gh pr comment "$PR_NUMBER" \
            --body "$BODY"

  # Gate job for the "Deploy Demo" required status check.
  # The actual deploy is skipped for fork PRs (no secrets), but GitHub
  # treats skipped required checks as failing. This job passes when the
  # deploy is skipped, so fork/dependabot PRs aren't blocked.
  deploy-demo-status:
    name: Deploy Demo
    runs-on: ubuntu-latest
    needs: [deploy-demo]
    if: always()
    steps:
      - name: Check deploy result
        run: |
          result="${{ needs.deploy-demo.result }}"
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            echo "Deploy demo: $result"
          else
            echo "Deploy demo: $result"
            exit 1
          fi

  # Build Docker image for the gRPC server.
  # Uses the pre-built runtime-python.cwasm from build-runtime-python to skip the
  # expensive WASM precompilation step inside Docker. Only pushes on main.
  # The Python-only server image (ERYX_LANGUAGES=python): built, never
  # pushed, to check it still builds and to report its size, which should
  # match the image before the JavaScript and shell guests.
  docker-python-only:
    name: Docker (Python only)
    runs-on: ubuntu-latest
    needs: [changes, build-runtime-python]
    if: >-
      needs.changes.outputs.full == 'true'
      && (github.event.pull_request.head.repo.fork != true
      && (github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.server == 'true'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Prepare runtime-python.cwasm for Docker build context
        run: cp crates/eryx-runtime/runtime-python.cwasm crates/eryx-server/runtime-python.cwasm

      - name: Log in to Docker Hub
        # Only main and release tags publish. ci.yml also runs on pushes to
        # multi-guest (for its caches), which must build like a PR, not push.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: sd2k
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The same tags as the all-languages image (see the docker job), with
      # this variant's suffix unless it gets the unsuffixed tags.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: sd2k/eryx-server
          flavor: |
            suffix=${{ env.DOCKER_UNSUFFIXED_VARIANT != 'python-only' && '-python' || '' }},onlatest=true
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=\d+.\d+.\d+,group=0
            type=match,pattern=\d+.\d+,group=0

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/eryx-server/Dockerfile
          build-args: |
            RUNTIME_SOURCE=custom
            RUNTIME_CWASM=crates/eryx-server/runtime-python.cwasm
            ERYX_LANGUAGES=python
          # Push or load, never both: some BuildKit versions refuse the pair
          # on the default docker driver (docker/build-push-action#727). The
          # docker job only pushes too.
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          load: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          tags: |
            eryx-server:python-only
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Report image size
        if: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        run: |
          size=$(docker image inspect eryx-server:python-only | jq '.[0].Size')
          echo "Python-only image size: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [changes, build-runtime-python, build-runtime-javascript, build-runtime-shell, build-bundler]
    if: >-
      needs.changes.outputs.full == 'true'
      && (github.event.pull_request.head.repo.fork != true
      && (github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.server == 'true'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Download guest runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasm-runtime-guest-*
          merge-multiple: true
          path: crates/eryx-runtime/

      - name: Prepare runtime-python.cwasm for Docker build context
        run: cp crates/eryx-runtime/runtime-python.cwasm crates/eryx-server/runtime-python.cwasm

      - name: Log in to Docker Hub
        # Only main and release tags publish. ci.yml also runs on pushes to
        # multi-guest (for its caches), which must build like a PR, not push.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: sd2k
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: sd2k/eryx-server
          # The suffix, if any, is DOCKER_UNSUFFIXED_VARIANT's (see env).
          flavor: |
            suffix=${{ env.DOCKER_UNSUFFIXED_VARIANT != 'all-languages' && '-all' || '' }},onlatest=true
          # On main: sha + branch + latest. On a release tag (eryx-v0.5.0):
          # the version tags 0.5.0 and 0.5 (type=match strips the eryx-v prefix).
          # latest stays tied to main and is not moved by tag builds.
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=\d+.\d+.\d+,group=0
            type=match,pattern=\d+.\d+,group=0

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/eryx-server/Dockerfile
          build-args: |
            RUNTIME_SOURCE=custom
            RUNTIME_CWASM=crates/eryx-server/runtime-python.cwasm
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
