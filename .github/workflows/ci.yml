name: CI

on:
  push:
    # multi-guest too, so its merges save the caches its PRs restore (a PR's
    # own caches are scoped to it). Only pushes save; see the save steps.
    branches: [main, multi-guest]
    # Release tags (pushed by release-plz via the GitHub App token) so the
    # docker job can publish a version-tagged image, e.g. sd2k/eryx-server:0.5.0.
    tags: ['eryx-v[0-9]+.[0-9]+.[0-9]+']
    #
    # Tag builds publish that image, so they must not restore anything from
    # the Actions cache: an entry written by an earlier run would flow straight
    # into it. Every cache step below is therefore disabled when github.ref is
    # a tag (rust-cache via lookup-only, kache and the rest via their own inputs or an
    # `if:`). See zizmor's cache-poisoning audit.
  pull_request:
    branches: [main, multi-guest]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # cargo-all-features has no prebuilt binary, so mise compiles it (~10s) in
  # every job. Only check-features uses it; it re-enables it below.
  MISE_DISABLE_TOOLS: cargo:cargo-all-features
  # Test and example binaries link the workspace crates, so they never hit
  # across commits, and runner ext4 has no reflink: kache would store a full
  # copy of each (hundreds of MB apiece), which filled the Test runner's disk.
  KACHE_CACHE_EXECUTABLES: "0"
  # Fail, rather than warn, when the committed crates/eryx-runtime/prebuilt/
  # was not built from this commit's guest sources. Jobs that download the
  # wasm-runtime artifact check the fresh copy, so the jobs that catch a stale
  # commit are those building from the checkout: Build eryx-runtime on a cache
  # miss, and the MSRV and platform checks on every core change.
  ERYX_REQUIRE_FRESH_PREBUILT: "1"
  # Which sd2k/eryx-server variant gets the unsuffixed tags (0.16.0, latest,
  # ...): `all-languages` or `python-only`. The other variant's tags get a
  # suffix: `-python` for the Python-only image, `-all` for the
  # all-languages one. All-languages, decided in #847.
  DOCKER_UNSUFFIXED_VARIANT: all-languages

jobs:
  # Detect which paths changed to skip unnecessary jobs.
  # Each downstream job has an explicit 'github.event_name == push' override
  # so that all jobs always run on pushes to main.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      # Whether to run the whole suite. PRs into multi-guest run a fast
      # subset (lint, fmt, Linux tests and what they need, feature checks);
      # everything else (pushes, PRs into main, tags) runs everything. The
      # jobs left out check `full` in their `if:`, so they report as skipped.
      full: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
      core: ${{ steps.filter.outputs.core }}
      server: ${{ steps.filter.outputs.server }}
      python: ${{ steps.filter.outputs.python }}
      python-sdk: ${{ steps.filter.outputs.python-sdk }}
      typescript-sdk: ${{ steps.filter.outputs.typescript-sdk }}
      book: ${{ steps.filter.outputs.book }}
      examples: ${{ steps.filter.outputs.examples }}
      js: ${{ steps.filter.outputs.js }}
      demo: ${{ steps.filter.outputs.demo }}
      bundler: ${{ steps.filter.outputs.bundler }}
      shell: ${{ steps.filter.outputs.shell }}
      notices: ${{ steps.filter.outputs.notices }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            core:
              - 'crates/eryx-core/**'
              - 'crates/eryx/**'
              - 'crates/eryx-vfs/**'
              - 'crates/eryx-guest-python/**'
              - 'crates/eryx-guest-js/**'
              - 'crates/eryx-guest-call/**'
              - 'crates/eryx-guest-shell/**'
              - 'crates/eryx-runtime/**'
              - 'crates/wit-dylib-ffi/**'
              - 'crates/eryx-precompile/**'
              - 'crates/eryx-packages/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              # Tool versions and the cargo-rail config drive what every Rust
              # job actually runs. Without these, a Renovate bump that touches
              # only mise.toml skips all of CI and merges green — which is how
              # cargo-rail 0.8.1 -> 0.21.0 (#297) landed and broke main.
              - 'mise.toml'
              - '.config/rail.toml'
            server:
              - 'crates/eryx-server/**'
            python:
              - 'crates/eryx-python/**'
              # pyeryx depends on it for the exceptions it shares
              - 'sdk/python/**'
            python-sdk:
              - 'sdk/python/**'
              - '.github/workflows/ci.yml'
            typescript-sdk:
              - 'sdk/typescript/**'
              - '.github/workflows/ci.yml'
            book:
              - 'book/**'
            examples:
              - 'examples/**'
            js:
              - 'js/**'
            demo:
              - 'demo/**'
            bundler:
              - 'crates/eryx-bundler/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            # What the Test job's shell-only step (no unstable-vfs) checks: the
            # shell guest, VFS, child processes and environments. Pull
            # requests touching none of it skip that step; pushes always run it.
            shell:
              - 'crates/eryx-guest-shell/**'
              - 'crates/eryx-vfs/**'
              - 'crates/eryx-packages/**'
              - 'crates/eryx/Cargo.toml'
              - 'crates/eryx/build.rs'
              - 'crates/eryx/src/process.rs'
              - 'crates/eryx/src/process/**'
              - 'crates/eryx/src/session/**'
              - 'crates/eryx/src/environment/**'
              - 'crates/eryx/src/embedded.rs'
              - 'crates/eryx/tests/shell_guest.rs'
              - 'crates/eryx/tests/commands.rs'
              - 'crates/eryx/tests/p3_guest.rs'
              - 'crates/eryx/tests/environment.rs'
              - 'crates/eryx/tests/js_environment.rs'
              - 'crates/eryx/tests/fixtures/**'
              - '.github/workflows/ci.yml'
            # What the third-party notices are made from (#837).
            notices:
              - '**/Cargo.lock'
              - '**/Cargo.toml'
              - 'crates/eryx/python-stdlib.tar.*'
              - 'crates/eryx-runtime/prebuilt/**'
              - 'about.toml'
              - 'third_party/**'
              - 'scripts/notices.py'
              - 'crates/eryx-runtime/libs/**'
              - 'crates/eryx-guest-js/src/node/**'
              - 'clis/coreutils.toml'
              - 'mise.toml'
              - '.github/workflows/ci.yml'

  # Fast check for dependency drift - runs in parallel with build
  unify-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      # cargo-rail's compiler evidence is `cargo check` builds of 8 views of
      # the workspace. Cold, that and the analysis over it take ~13 min; with
      # a warm target dir the whole check takes under 20s.
      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          # PR caches can't be read by other PRs and evict main's (10GB repo limit),
          # so only pushes to main and multi-guest save.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Install protoc for eryx-server build.rs
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check dependency unification
        run: cargo rail unify --check
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"

  # Third-party notices (#837): every shipped crate's licence is one
  # about.toml accepts, and every vendored non-Rust input has an entry in
  # third_party/manual.toml with its current version. Reads the lock files
  # only; nothing is built.
  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.notices == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - name: Check the notices
        run: mise run notices-check

  # The bundled stdlib ships precompiled bytecode (the sandbox mounts it
  # read-only, so Python can't cache it). Fail if it drifts from the sources.
  stdlib-bytecode:
    name: Stdlib bytecode
    # Cheap (no Rust build), so it runs on every change, including edits to
    # the script itself, which the `core` path filter doesn't cover.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Exact patch version: other releases can marshal different bytecode.
          python-version: "3.14.10"

      - name: Check stdlib bytecode is up to date
        run: scripts/compile-stdlib.sh --check

  # Build eryx-guest-python and precompile it - other jobs depend on this.
  # Runs when core paths change, or when any downstream job needs WASM artifacts.
  build-runtime-python:
    name: Build eryx-runtime
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.python == 'true'
      || needs.changes.outputs.book == 'true'
      || needs.changes.outputs.examples == 'true'
      || needs.changes.outputs.server == 'true'
      || needs.changes.outputs.js == 'true'
      || needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache WASM runtime artifacts
        id: wasm-cache
        # Skipped on tag builds (see the note on `on.push.tags`); the cache-hit
        # checks below then read as a miss and build from scratch. zizmor does
        # not evaluate a step `if:` for actions/cache, and lookup-only would
        # report a hit without restoring the files, hence the ignore.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/eryx-runtime/runtime-python.wasm
            crates/eryx-runtime/runtime-python.cwasm
            crates/eryx-runtime/runtime-windows.cwasm
            crates/eryx-runtime/runtime-macos.cwasm
            crates/eryx-runtime/prebuilt/
            crates/eryx-guest-python/target/liberyx_runtime.so
          # NOTE: this key does not cover the cwasm's CPU-feature configuration,
          # which comes from `ERYX_CPU_FEATURES` below and the flag lists in
          # crates/eryx/src/wasm.rs (compiled into the `precompile` example).
          # Changing either without busting the version prefix silently reuses a
          # cwasm built with the old settings. Bumped v3 -> v4 for the
          # stdout bytes migration (list<u8> WIT change), v4 -> v5 for the
          # Windows cwasm built alongside the Linux one, v5 -> v6 for the macOS one,
          # v6 -> v7 for the eryx version stored in every cwasm (engine config in
          # crates/eryx/src/wasm.rs). The version itself comes from Cargo.toml,
          # which the key covers. v7 -> v8: the engine enables the component
          # model's more async builtins (#816).
          key: wasm-runtime-v8-${{ hashFiles('crates/eryx-guest-python/src/**', 'crates/eryx-guest-call/**', 'crates/eryx-guest-python/clock_stubs.c', 'crates/eryx-guest-python/Cargo.toml', 'crates/wit-dylib-ffi/**', 'crates/eryx-runtime/build.rs', 'crates/eryx-runtime/src/**', 'crates/eryx-runtime/wit/**', 'crates/eryx-runtime/libs/*.zst', 'Cargo.lock', 'Cargo.toml', 'mise.toml', 'rust-toolchain.toml') }}

      - name: Touch cached artifacts
        if: steps.wasm-cache.outputs.cache-hit == 'true'
        run: |
          # Touch all cached files so mise/make consider them current
          touch crates/eryx-runtime/runtime-python.wasm
          touch crates/eryx-runtime/runtime-python.cwasm
          touch crates/eryx-runtime/runtime-windows.cwasm
          touch crates/eryx-runtime/runtime-macos.cwasm
          touch crates/eryx-runtime/prebuilt/*
          touch crates/eryx-guest-python/target/liberyx_runtime.so

      - name: Upload WASM artifacts (cache hit)
        if: steps.wasm-cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-runtime
          path: |
            crates/eryx-runtime/runtime-python.wasm
            crates/eryx-runtime/runtime-python.cwasm
            crates/eryx-runtime/runtime-windows.cwasm
            crates/eryx-runtime/runtime-macos.cwasm
            crates/eryx-runtime/prebuilt/
            crates/eryx-guest-python/target/liberyx_runtime.so
          retention-days: 1

      - uses: ./.github/actions/setup-rust
        if: steps.wasm-cache.outputs.cache-hit != 'true'

      - name: Configure Rust cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          # PR caches can't be read by other PRs and evict main's (10GB repo limit),
          # so only pushes to main and multi-guest save.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Force rebuild (cache may have stale timestamps)
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          # Touch ALL sources to ensure mise doesn't skip build due to cached timestamps
          # The Rust cache may restore .rlib files with newer timestamps than sources
          find crates/eryx-guest-python/src -name "*.rs" -exec touch {} +
          touch crates/eryx-guest-python/clock_stubs.c
          touch crates/eryx-guest-python/Cargo.toml
          # Remove outputs (mise checks mtime, not existence)
          rm -f crates/eryx-runtime/runtime-python.wasm crates/eryx-runtime/runtime-python.cwasm
          # Clean nested build-std target dirs to avoid stale std artifacts
          # when the nightly toolchain updates between runs
          rm -rf target/release/build/eryx-runtime-*/out/wasm-runtime-target target/release/build/eryx-runtime/*/out/wasm-runtime-target

      - name: Build eryx-runtime
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: mise run build-runtime-python

      - name: Copy prebuilt late-linking artifacts
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          mise run update-prebuilt
          # Find the OUT_DIR that actually contains the built artifacts
          # (not just any OUT_DIR - the preinit build creates a new one without .so files)
          OUT_DIR=$(find target/release -path "*/eryx-runtime*/out/liberyx_runtime.so" -type f | head -1 | xargs dirname)
          echo "Found OUT_DIR: $OUT_DIR"
          # Also copy liberyx_runtime.so for eryx-guest-python tests now, before preinit build
          mkdir -p crates/eryx-guest-python/target
          cp "$OUT_DIR/liberyx_runtime.so" crates/eryx-guest-python/target/
          ls -la crates/eryx-runtime/prebuilt/
          ls -la crates/eryx-guest-python/target/

      - name: Set up python-stdlib for preinit
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: mise run setup-eryx-runtime-tests

      - name: Precompile WASM with preinit
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          # Use preinit feature for faster sandbox instantiation in downstream jobs
          # (pre-initializes Python interpreter in the snapshot)
          cargo run -p eryx --example precompile --features preinit --release
          # Cross-compile the Windows cwasm here too, so the Windows job doesn't
          # need its own release build of eryx just to pre-initialize.
          cargo run -p eryx --example precompile --features preinit --release -- \
            --target x86_64-pc-windows-msvc \
            --output crates/eryx-runtime/runtime-windows.cwasm
          # Same for the macOS job. aarch64 has no psABI presets, so "baseline"
          # is the portable setting (as in python-release.yml).
          ERYX_CPU_FEATURES=baseline cargo run -p eryx --example precompile --features preinit --release -- \
            --target aarch64-apple-darwin \
            --output crates/eryx-runtime/runtime-macos.cwasm
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"
          # Use x86-64-v2 for portable cwasm across runner types
          ERYX_CPU_FEATURES: "x86-64-v2"

      - name: Save WASM runtime artifacts
        # Pushes to main and multi-guest save; PRs only restore (a PR's
        # caches are scoped to it, and would only evict main's).
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest') && steps.wasm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/eryx-runtime/runtime-python.wasm
            crates/eryx-runtime/runtime-python.cwasm
            crates/eryx-runtime/runtime-windows.cwasm
            crates/eryx-runtime/runtime-macos.cwasm
            crates/eryx-runtime/prebuilt/
            crates/eryx-guest-python/target/liberyx_runtime.so
          key: ${{ steps.wasm-cache.outputs.cache-primary-key }}

      - name: Upload WASM artifacts (cache miss)
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-runtime
          path: |
            crates/eryx-runtime/runtime-python.wasm
            crates/eryx-runtime/runtime-python.cwasm
            crates/eryx-runtime/runtime-windows.cwasm
            crates/eryx-runtime/runtime-macos.cwasm
            crates/eryx-runtime/prebuilt/
            crates/eryx-guest-python/target/liberyx_runtime.so
          retention-days: 1

  # Build and precompile the JavaScript guest runtime. It has its own cache key,
  # over only what it is built from, so changing another guest doesn't
  # rebuild it. Also cross-compiles the Windows and macOS cwasms the
  # pyeryx jobs embed.
  build-runtime-javascript:
    name: Build JavaScript runtime
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.python == 'true'
      || needs.changes.outputs.book == 'true'
      || needs.changes.outputs.examples == 'true'
      || needs.changes.outputs.server == 'true'
      || needs.changes.outputs.js == 'true'
      || needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache JavaScript runtime
        id: wasm-cache
        # See the Python runtime's cache step for the tag-build caveats.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/eryx-runtime/runtime-javascript.wasm
            crates/eryx-runtime/runtime-javascript.cwasm
            crates/eryx-runtime/runtime-javascript-windows.cwasm
            crates/eryx-runtime/runtime-javascript-macos.cwasm
          # As with the Python key, the cwasm's engine and CPU-feature settings
          # aren't covered: bump the prefix when they change. v1 -> v2: v1
          # cwasms were built without the CPU presets (host features). v3 -> v4:
          # more async builtins (#816).
          key: wasm-runtime-javascript-v4-${{ hashFiles('crates/eryx-guest-js/**', 'crates/eryx/examples/precompile.rs', 'crates/eryx-runtime/src/preinit.rs', 'crates/eryx-guest-call/**', 'crates/eryx-guest-python/clock_stubs.c', 'crates/wit-dylib-ffi/**', 'crates/eryx-runtime/build.rs', 'crates/eryx-runtime/wit/**', 'crates/eryx-runtime/libs/*.zst', 'Cargo.lock', 'Cargo.toml', 'mise.toml', 'rust-toolchain.toml') }}

      - uses: ./.github/actions/setup-rust
        if: steps.wasm-cache.outputs.cache-hit != 'true'

      - name: Configure Rust cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          # PR caches can't be read by other PRs and evict main's (10GB repo limit),
          # so only pushes to main and multi-guest save.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Build and precompile
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          mise run build-runtime-javascript
          # The precompile example cross-compiles and pre-initializes, as for
          # the Python runtime (`preinit` also lets it apply ERYX_CPU_FEATURES).
          compile() {
            ERYX_CPU_FEATURES="$1" cargo run -p eryx --example precompile --features preinit --release -- "${@:2}"
          }
          export ERYX_WASM_PATH=crates/eryx-runtime/runtime-javascript.wasm ERYX_LANGUAGE=javascript
          # Portable CPU features, as for the Python runtime.
          compile x86-64-v2 --output crates/eryx-runtime/runtime-javascript.cwasm
          compile x86-64-v2 --target x86_64-pc-windows-msvc \
            --output crates/eryx-runtime/runtime-javascript-windows.cwasm
          # aarch64 has no psABI presets, so "baseline" is the portable setting.
          compile baseline --target aarch64-apple-darwin \
            --output crates/eryx-runtime/runtime-javascript-macos.cwasm
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"

      - name: Save JavaScript runtime
        # Pushes to main and multi-guest save; PRs only restore (a PR's
        # caches are scoped to it, and would only evict main's).
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest') && steps.wasm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/eryx-runtime/runtime-javascript.wasm
            crates/eryx-runtime/runtime-javascript.cwasm
            crates/eryx-runtime/runtime-javascript-windows.cwasm
            crates/eryx-runtime/runtime-javascript-macos.cwasm
          key: ${{ steps.wasm-cache.outputs.cache-primary-key }}

      - name: Upload JavaScript runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-runtime-guest-javascript
          path: crates/eryx-runtime/runtime-javascript*
          retention-days: 1

  # Build and precompile the shell guest runtime. It has its own cache key,
  # over only what it is built from, so changing another guest doesn't
  # rebuild it. Also cross-compiles the Windows and macOS cwasms the
  # pyeryx jobs embed.
  build-runtime-shell:
    name: Build shell runtime
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.python == 'true'
      || needs.changes.outputs.book == 'true'
      || needs.changes.outputs.examples == 'true'
      || needs.changes.outputs.server == 'true'
      || needs.changes.outputs.js == 'true'
      || needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache shell runtime
        id: wasm-cache
        # See the Python runtime's cache step for the tag-build caveats.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/eryx-runtime/runtime-shell.wasm
            crates/eryx-runtime/runtime-shell.cwasm
            crates/eryx-runtime/runtime-shell-windows.cwasm
            crates/eryx-runtime/runtime-shell-macos.cwasm
            crates/eryx-runtime/coreutils.cwasm
            crates/eryx-runtime/coreutils-windows.cwasm
            crates/eryx-runtime/coreutils-macos.cwasm
          # As with the Python key, the cwasm's engine and CPU-feature settings
          # aren't covered: bump the prefix when they change. v1 -> v2: v1
          # cwasms were built without the CPU presets (host features). v2 -> v3:
          # the shell's embedded coreutils (#809). v3 -> v4: the shell is
          # built for wasm32-wasip3. v4 -> v5: more async builtins (#816).
          key: wasm-runtime-shell-v5-${{ hashFiles('crates/eryx-guest-shell/**', 'crates/eryx-runtime/wit/**', 'clis/coreutils.toml', 'clis/patches/patch-uucore-wasip2.sh', 'crates/eryx-build/**', 'Cargo.toml', 'mise.toml', 'rust-toolchain.toml') }}

      - uses: ./.github/actions/setup-rust
        if: steps.wasm-cache.outputs.cache-hit != 'true'

      - name: Configure Rust cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          # PR caches can't be read by other PRs and evict main's (10GB repo limit),
          # so only pushes to main and multi-guest save.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Build and precompile
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          mise run build-runtime-shell
          # The precompile example cross-compiles, as for the Python runtime.
          # `preinit` is what lets it apply ERYX_CPU_FEATURES; it doesn't
          # pre-initialize the shell.
          compile() {
            ERYX_CPU_FEATURES="$1" cargo run -p eryx --example precompile --features preinit --release -- "${@:2}"
          }
          export ERYX_WASM_PATH=crates/eryx-runtime/runtime-shell.wasm ERYX_LANGUAGE=shell
          # Portable CPU features, as for the Python runtime.
          compile x86-64-v2 --output crates/eryx-runtime/runtime-shell.cwasm
          compile x86-64-v2 --target x86_64-pc-windows-msvc \
            --output crates/eryx-runtime/runtime-shell-windows.cwasm
          # aarch64 has no psABI presets, so "baseline" is the portable setting.
          compile baseline --target aarch64-apple-darwin \
            --output crates/eryx-runtime/runtime-shell-macos.cwasm

          # The shell's embedded commands (the `coreutils` feature): built from
          # clis/coreutils.toml, precompiled like the runtime but as a command.
          mise run build-coreutils
          export ERYX_WASM_PATH=crates/eryx-runtime/coreutils.wasm ERYX_LANGUAGE=command
          compile x86-64-v2 --output crates/eryx-runtime/coreutils.cwasm
          compile x86-64-v2 --target x86_64-pc-windows-msvc \
            --output crates/eryx-runtime/coreutils-windows.cwasm
          compile baseline --target aarch64-apple-darwin \
            --output crates/eryx-runtime/coreutils-macos.cwasm
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"

      - name: Save shell runtime
        # Pushes to main and multi-guest save; PRs only restore (a PR's
        # caches are scoped to it, and would only evict main's).
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest') && steps.wasm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/eryx-runtime/runtime-shell.wasm
            crates/eryx-runtime/runtime-shell.cwasm
            crates/eryx-runtime/runtime-shell-windows.cwasm
            crates/eryx-runtime/runtime-shell-macos.cwasm
            crates/eryx-runtime/coreutils.cwasm
            crates/eryx-runtime/coreutils-windows.cwasm
            crates/eryx-runtime/coreutils-macos.cwasm
          key: ${{ steps.wasm-cache.outputs.cache-primary-key }}

      - name: Upload shell runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-runtime-guest-shell
          path: |
            crates/eryx-runtime/runtime-shell*
            crates/eryx-runtime/coreutils*.cwasm
          retention-days: 1

  # The shell guest is its own workspace (see AGENTS.md), so the workspace
  # lint jobs don't cover it.
  shell-guest-lint:
    name: Shell guest lint
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - name: Check formatting
        working-directory: crates/eryx-guest-shell
        run: cargo fmt --check

      # The guest is its own workspace, so it keeps copies of the host's WIT.
      - name: WIT copies match the host's
        run: |
          cmp crates/eryx-runtime/wit/runtime.wit crates/eryx-guest-shell/wit/deps/sandbox.wit
          cmp crates/eryx-runtime/wit/deps/net.wit crates/eryx-guest-shell/wit/deps/net.wit
          cmp crates/eryx-runtime/wit/deps/process.wit crates/eryx-guest-shell/wit/deps/process.wit

      # It ships for WASI 0.3, and for WASI 0.2 in js/eryx.
      - name: Clippy
        working-directory: crates/eryx-guest-shell
        run: |
          rustup target add wasm32-wasip2 wasm32-wasip3
          cargo clippy --locked --target wasm32-wasip3 -- -D warnings
          cargo clippy --locked --target wasm32-wasip2 -- -D warnings

      # The argument parsing and builtins are plain Rust, so their unit tests
      # run natively.
      - name: Unit tests
        working-directory: crates/eryx-guest-shell
        run: cargo test --locked --lib

  # The JavaScript bundler (rolldown as a WASI command), its own workspace,
  # embedded by eryx's `packages` feature: builds with --all-features need
  # its cwasm, so this runs whenever the runtimes do.
  build-bundler:
    name: Build bundler
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.python == 'true'
      || needs.changes.outputs.book == 'true'
      || needs.changes.outputs.examples == 'true'
      || needs.changes.outputs.server == 'true'
      || needs.changes.outputs.js == 'true'
      || needs.changes.outputs.demo == 'true'
      || needs.changes.outputs.bundler == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache bundler
        id: wasm-cache
        # See the Python runtime's cache step for the tag-build caveats.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/eryx-runtime/eryx-bundler.wasm
            crates/eryx-runtime/eryx-bundler.cwasm
            crates/eryx-runtime/eryx-bundler-windows.cwasm
            crates/eryx-runtime/eryx-bundler-macos.cwasm
          # As for the runtimes, the cwasm's engine and CPU-feature settings
          # aren't covered: bump the prefix when they change. v1 -> v2: more
          # async builtins (#816).
          key: wasm-bundler-v2-${{ hashFiles('crates/eryx-bundler/src/**', 'crates/eryx-bundler/vendor/**', 'crates/eryx-bundler/tests/**', 'crates/eryx-bundler/Cargo.*', 'crates/eryx-bundler/smoke.sh', 'Cargo.lock', 'Cargo.toml', 'mise.toml', 'rust-toolchain.toml') }}

      - uses: ./.github/actions/setup-rust
        if: steps.wasm-cache.outputs.cache-hit != 'true'

      - name: Lint, test and smoke-test
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: mise run test-bundler

      - name: Precompile
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          compile() {
            ERYX_CPU_FEATURES="$1" cargo run -p eryx --example precompile --features preinit --release -- "${@:2}"
          }
          # A command, like coreutils: portable CPU features, as for the runtimes.
          export ERYX_WASM_PATH=crates/eryx-runtime/eryx-bundler.wasm ERYX_LANGUAGE=command
          compile x86-64-v2 --output crates/eryx-runtime/eryx-bundler.cwasm
          compile x86-64-v2 --target x86_64-pc-windows-msvc \
            --output crates/eryx-runtime/eryx-bundler-windows.cwasm
          # aarch64 has no psABI presets, so "baseline" is the portable setting.
          compile baseline --target aarch64-apple-darwin \
            --output crates/eryx-runtime/eryx-bundler-macos.cwasm
        env:
          ERYX_PRECOMPILE_BOOTSTRAP: "1"

      - name: Save bundler
        # Pushes to main and multi-guest save; PRs only restore (a PR's
        # caches are scoped to it, and would only evict main's).
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest') && steps.wasm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/eryx-runtime/eryx-bundler.wasm
            crates/eryx-runtime/eryx-bundler.cwasm
            crates/eryx-runtime/eryx-bundler-windows.cwasm
            crates/eryx-runtime/eryx-bundler-macos.cwasm
          key: ${{ steps.wasm-cache.outputs.cache-primary-key }}

      # Named like the guest runtimes, so the jobs that download those get it.
      - name: Upload bundler
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-runtime-guest-bundler
          path: crates/eryx-runtime/eryx-bundler*
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes, build-runtime-python, build-runtime-javascript, build-runtime-shell, build-bundler]
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.server == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Download guest runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasm-runtime-guest-*
          merge-multiple: true
          path: crates/eryx-runtime/

      - uses: ./.github/actions/mark-wasm-current

      - uses: ./.github/actions/setup-rust

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # Use --all-features now that prebuilt artifacts are available
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run clippy (eryx, embedded without unstable-vfs)
        # Catches code that is only used under `unstable-vfs` (warnings --all-features hides).
        run: cargo clippy -p eryx --all-targets --features embedded -- -D warnings

      - name: Run clippy (eryx, default features)
        # Catches code that is only used under some feature, which is dead
        # with the defaults.
        run: cargo clippy -p eryx --all-targets -- -D warnings

      - name: Check eryx tests with each feature alone
        # A test that needs more features than it is gated on fails to build
        # here, rather than only for whoever runs it with that one feature.
        run: |
          for features in macros embedded-stdlib embedded preinit native-extensions unstable-vfs unstable-internals javascript shell; do
            echo "::group::--features $features"
            cargo check -p eryx --tests --features "$features"
            echo "::endgroup::"
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes, build-runtime-python, build-runtime-javascript, build-runtime-shell, build-bundler]
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.server == 'true'
    steps:
      # The full run and the shell-only run below each build a feature set of
      # the workspace, which a cold kache can't fit in the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Download guest runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasm-runtime-guest-*
          merge-multiple: true
          path: crates/eryx-runtime/

      - uses: ./.github/actions/mark-wasm-current

      - name: Set up eryx-guest-python test artifacts
        run: |
          # Extract python stdlib for eryx-guest-python tests (from checked-in archive)
          mkdir -p crates/eryx-guest-python/tests/python-stdlib
          tar -xf crates/eryx/python-stdlib.tar.zst -C crates/eryx-guest-python/tests/
          # Create empty site-packages directory (tests expect it)
          mkdir -p crates/eryx-guest-python/tests/site-packages
          ls -la crates/eryx-guest-python/target/
          find crates/eryx-guest-python/tests/python-stdlib/ -mindepth 1 -maxdepth 1 | sort | head -10

      # For crates/eryx/tests/pooling_native_extensions.rs.
      - name: Download numpy-wasi
        run: |
          curl -fSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/numpy-wasi.tar.gz" \
            "https://github.com/eryx-org/eryx/releases/download/demo-assets/numpy-wasi.tar.gz"
          echo "ERYX_TEST_NUMPY_WASI=$RUNNER_TEMP/numpy-wasi.tar.gz" >> "$GITHUB_ENV"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # No apt anywhere in this workflow, deliberately. Beyond the dpkg-lock
      # hang that took protoc off apt in #337, `azure.archive.ubuntu.com` is
      # slow often enough to matter: on #339 `apt-get update` pulled 11.4 MB of
      # package indexes at 47 kB/s, taking 4m01s, then spent another 38s and
      # four `Ign:` retries fetching mold before falling back to
      # archive.ubuntu.com — 4m51s against this step's 5m timeout, for a 2.5 MB
      # linker. setup-mold fetches a prebuilt release from GitHub instead, the
      # same trade as arduino/setup-protoc above.
      #
      # Nothing else was needed from apt: the runner image already ships clang
      # and gcc, and `-fuse-ld=mold` works with the default gcc driver, so no
      # `linker =` override is required either.
      - name: Install mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Configure mold linker
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "link-arg=-fuse-ld=mold"]
          EOF

      - uses: ./.github/actions/setup-rust

      # kache (per-crate compiler cache) in place of rust-cache on the two
      # slowest compile-bound jobs. Its store goes in the Actions cache, one
      # entry per lockfile, saved from main and multi-guest pushes only (like
      # rust-cache's save-if) so PR runs never evict their entries.
      # Build-script outputs are cached too, which a remote (S3/R2) backend
      # can't do.
      - name: Configure kache
        id: kache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v1.2.2
          github-cache: true
          # Bump the suffix when [profile.dev.package] changes. The key only
          # hashes Cargo.lock, and an exact hit never re-saves, so rebuilt deps
          # would otherwise be recompiled every run until the lockfile changes.
          cache-key-prefix: kache-test-p2
          save-cache: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}
          pr-comment: false

      # Tests build small guests of their own: a wasm32-wasip3 probe
      # (crates/eryx-vfs/tests/p3_filesystem.rs), a wasm32-wasip3 guest
      # (crates/eryx/tests/p3_guest.rs) and a command built for both
      # (crates/eryx/tests/commands.rs, child_network.rs).
      - name: Install wasm32-wasip2 and wasm32-wasip3 targets
        run: rustup target add wasm32-wasip2 wasm32-wasip3

      - name: Run tests
        # Use --all-features to test everything. This works because:
        # - runtime-python.wasm and runtime-python.cwasm are provided by artifacts
        # - prebuilt/liberyx_*.so.zst are provided for late-linking feature
        # - liberyx_runtime.so and python-stdlib are provided for eryx-guest-python tests
        # Use --profile ci for longer timeouts on slow WASM component tests
        run: cargo nextest run --workspace --all-features --profile ci

      # The shell (and JavaScript) without `unstable-vfs`, which --all-features
      # always turns on: bugs gated on its absence (#910's p3 gate, #914's
      # environment mount) only show up here. (`packages` implies
      # `environment`.) Only the suites that exercise
      # that path, reusing this job's artifacts and compiled dependencies, so
      # it costs about the eryx crate's own rebuild plus a minute of tests
      # (5.4 min on #941). Pull requests run it only when the `shell` paths
      # change; pushes and tags always do.
      - name: Run the shell suites without unstable-vfs
        if: github.event_name != 'pull_request' || needs.changes.outputs.shell == 'true'
        run: |
          df -h .
          cargo nextest run -p eryx --profile ci \
            --features embedded,shell,javascript,packages \
            --test shell_guest --test commands --test p3_guest --test environment \
            --test js_environment
          df -h .

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true'
      && (github.event_name == 'push'
      || needs.changes.outputs.core == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_save: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}
          mise_toml: |
            [tools]
            rust = "1.100"

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Check MSRV
        # Exclude crates that require WASM artifacts or WASI SDK
        run: cargo check --workspace --exclude eryx-python --exclude eryx-precompile --exclude eryx-server

  platform-check:
    name: ${{ matrix.os == 'windows-latest' && 'Windows' || 'macOS' }} Check
    runs-on: ${{ matrix.os }}
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true'
      && (github.event_name == 'push'
      || needs.changes.outputs.core == 'true')
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Install Rust
        # Install the pinned toolchain rather than trusting the runner image's
        # preinstalled Rust, which lags: the macos-latest image shipped 1.97.1
        # while the workspace MSRV was 1.98.0, so `cargo check` refused to build
        # ("rustc 1.97.1 is not supported by the following packages"). Reading
        # mise.toml keeps this following the same pin as every other job, which
        # Renovate bumps as one "Rust toolchain" group.
        shell: bash
        run: |
          RUST_VERSION=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)
          if [ -z "$RUST_VERSION" ]; then
            echo "could not read the rust pin from mise.toml" >&2
            exit 1
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup show active-toolchain

      - name: Check compilation
        # Exclude crates that need WASI SDK, Python, or WASM artifacts
        run: cargo check --workspace --exclude eryx-python --exclude eryx-precompile --exclude eryx-guest-python --exclude eryx-server

      # Host-file appends reopen the file in a platform-specific way
      # (crates/eryx-vfs/src/file_io.rs), so run those tests here too.
      - name: Test host-file appends
        run: cargo test -p eryx-vfs --lib -- append reopen

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    needs: [changes, build-runtime-python, build-runtime-javascript, build-runtime-shell, build-bundler]
    if: >-
      needs.changes.outputs.full == 'true'
      && (github.event_name == 'push'
      || needs.changes.outputs.core == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Download guest runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasm-runtime-guest-*
          merge-multiple: true
          path: crates/eryx-runtime/

      - uses: ./.github/actions/mark-wasm-current

      - uses: ./.github/actions/setup-rust

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Build documentation
        # Use --all-features now that prebuilt artifacts are available
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Simulate docs.rs build (no WASM artifacts needed)
  docsrs:
    name: docs.rs
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true'
      && (github.event_name == 'push'
      || needs.changes.outputs.core == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        run: rustup toolchain install nightly

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Build docs (docs.rs simulation)
        run: DOCS_RS=1 cargo +nightly doc -p eryx -p eryx-runtime --all-features --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

  # Report public API changes against the PR's base. Informational only: a
  # breaking change is expected to be marked `!` in its commit, and release-plz
  # runs the authoritative check when it prepares a release.
  semver:
    name: Semver Check (report only)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true'
      && (github.event_name == 'pull_request'
      && needs.changes.outputs.core == 'true')
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Install cargo-semver-checks
        run: cargo install --locked --version 0.51.0 cargo-semver-checks

      # The `embedded` feature's build script needs a runtime-python.cwasm, which
      # rustdoc only embeds as bytes. An empty placeholder is enough (see the
      # same step in release-plz.yml).
      - name: Provide placeholder cwasms
        run: |
          : > "$RUNNER_TEMP/runtime-python.cwasm"
          echo "ERYX_RUNTIME_CWASM=$RUNNER_TEMP/runtime-python.cwasm" >> "$GITHUB_ENV"
          for lang in JAVASCRIPT SHELL; do
            : > "$RUNNER_TEMP/runtime-$lang.cwasm"
            echo "ERYX_RUNTIME_CWASM_$lang=$RUNNER_TEMP/runtime-$lang.cwasm" >> "$GITHUB_ENV"
          done
          # The shell's embedded coreutils (the `coreutils` feature, #809).
          : > "$RUNNER_TEMP/coreutils.cwasm"
          echo "ERYX_COREUTILS_CWASM=$RUNNER_TEMP/coreutils.cwasm" >> "$GITHUB_ENV"
          # The bundler environment builds run (the `packages` feature, #827).
          : > "$RUNNER_TEMP/eryx-bundler.cwasm"
          echo "ERYX_BUNDLER_CWASM=$RUNNER_TEMP/eryx-bundler.cwasm" >> "$GITHUB_ENV"

      - name: Check public API against the base branch
        run: cargo semver-checks check-release -p eryx --baseline-rev "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # Check that all feature combinations compile
  check-features:
    name: Check Feature Combinations
    runs-on: ubuntu-latest
    needs: [changes, build-runtime-python, build-runtime-javascript, build-runtime-shell, build-bundler]
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
    env:
      MISE_DISABLE_TOOLS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Download guest runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasm-runtime-guest-*
          merge-multiple: true
          path: crates/eryx-runtime/

      - uses: ./.github/actions/mark-wasm-current

      - uses: ./.github/actions/setup-rust

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - name: Check all feature combinations
        # cargo-all-features checks the powerset of feature combinations.
        # The Cargo.toml config skips preinit/native-extensions for local dev (no artifacts),
        # but in CI we have artifacts, so we check those separately.
        run: |
          echo "=== Checking feature powerset (excluding preinit/native-extensions) ==="
          cargo check-all-features -- -p eryx

          echo "=== Checking features that require runtime artifacts ==="
          cargo check -p eryx --features preinit
          cargo check -p eryx --features embedded,preinit
          cargo check -p eryx --features native-extensions
          cargo check -p eryx --features embedded,native-extensions

          echo "=== Checking eryx-packages without npm (skipped by cargo-all-features) ==="
          cargo check -p eryx-packages --no-default-features

  # Run examples to ensure they don't bitrot
  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs: [changes, build-runtime-python, build-runtime-javascript, build-runtime-shell, build-bundler]
    if: >-
      needs.changes.outputs.full == 'true'
      && (github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.examples == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Download guest runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasm-runtime-guest-*
          merge-multiple: true
          path: crates/eryx-runtime/

      - uses: ./.github/actions/mark-wasm-current

      - uses: ./.github/actions/setup-rust

      - name: Configure kache
        id: kache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v1.2.2
          github-cache: true
          cache-key-prefix: kache-examples
          save-cache: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}
          pr-comment: false

      - name: Run examples
        run: |
          echo "=== simple ==="
          cargo run --package eryx --example simple --features embedded --release
          echo "=== parallel_callbacks ==="
          cargo run --package eryx --example parallel_callbacks --features embedded --release
          echo "=== with_tracing ==="
          cargo run --package eryx --example with_tracing --features embedded --release
          echo "=== error_handling ==="
          cargo run --package eryx --example error_handling --features embedded --release
          echo "=== resource_limits ==="
          cargo run --package eryx --example resource_limits --features embedded --release
          echo "=== custom_library ==="
          cargo run --package eryx --example custom_library --features embedded --release
          echo "=== session_reuse ==="
          cargo run --package eryx --example session_reuse --features embedded --release
          echo "=== runtime_callbacks ==="
          cargo run --package eryx --example runtime_callbacks --features embedded --release
          echo "=== precompile ==="
          cargo run --package eryx --example precompile --features embedded --release
          echo "=== embedded_runtime ==="
          cargo run --package eryx --example embedded_runtime --features embedded --release
          echo "=== trace_events ==="
          cargo run --package eryx --example trace_events --features embedded --release

  # Test Python bindings
  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    needs: [changes, build-runtime-python, build-runtime-javascript, build-runtime-shell, build-bundler]
    if: >-
      needs.changes.outputs.full == 'true'
      && (github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.python == 'true')
    env:
      # The release profile uses codegen-units = 1 for shipped artifacts, which
      # makes LLVM single-threaded on the eryx crate. These builds only feed
      # tests, so trade a little runtime speed for a ~2.5x faster rebuild.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Download guest runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasm-runtime-guest-*
          merge-multiple: true
          path: crates/eryx-runtime/

      - uses: ./.github/actions/mark-wasm-current

      - uses: ./.github/actions/setup-rust

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build and install eryx-python with dev dependencies
        working-directory: crates/eryx-python
        run: |
          uv venv ../../.venv
          source ../../.venv/bin/activate
          uv pip install maturin
          # pyeryx depends on eryx-run: this repo's, so changes to both are tested together
          uv pip install -e ../../sdk/python
          maturin develop --release
          uv export --extra dev --no-dev --no-hashes --no-emit-project --frozen | uv pip install -r -

      - name: Run Python tests
        working-directory: crates/eryx-python
        run: |
          source ../../.venv/bin/activate
          pytest tests/ -v -n auto

      - name: Check type stubs match the extension module
        working-directory: crates/eryx-python
        run: |
          source ../../.venv/bin/activate
          python -m mypy.stubtest eryx._eryx --allowlist stubtest-allowlist.txt

      - name: Run Python examples
        working-directory: crates/eryx-python
        run: |
          source ../../.venv/bin/activate
          echo "=== simple.py ==="
          python examples/simple.py
          echo "=== error_handling.py ==="
          python examples/error_handling.py
          echo "=== resource_limits.py ==="
          python examples/resource_limits.py

  # Test Python bindings on Windows so platform-specific failures (path
  # separators, temp-dir cleanup, native extension loading) are caught before
  # the release workflow, which is the only other place Windows tests run.
  python-bindings-windows:
    name: Python Bindings (Windows)
    runs-on: windows-latest
    needs: [changes, build-runtime-python, build-runtime-javascript, build-runtime-shell, build-bundler]
    if: >-
      needs.changes.outputs.full == 'true'
      && (github.event_name == 'push'
      || needs.changes.outputs.core == 'true'
      || needs.changes.outputs.python == 'true')
    env:
      # The release profile uses codegen-units = 1 for shipped artifacts, which
      # makes LLVM single-threaded on the eryx crate. These builds only feed
      # tests, so trade a little runtime speed for a ~2.5x faster rebuild.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-runtime
          path: crates/

      - name: Download guest runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasm-runtime-guest-*
          merge-multiple: true
          path: crates/eryx-runtime/

      - name: Mark WASM artifacts as current
        shell: bash
        run: |
          touch crates/eryx-runtime/runtime-python.wasm
          touch crates/eryx-runtime/prebuilt/*

      - name: Use the Windows cwasms
        shell: bash
        run: |
          # Cross-compiled by the build-runtime-* jobs; embedded by the eryx build.
          mv crates/eryx-runtime/runtime-windows.cwasm crates/eryx-runtime/runtime-python.cwasm
          for name in runtime-javascript runtime-shell coreutils; do
            mv "crates/eryx-runtime/$name-windows.cwasm" "crates/eryx-runtime/$name.cwasm"
          done
          touch crates/eryx-runtime/*.cwasm

      - name: Install Rust
        shell: bash
        run: |
          RUST_VERSION=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)
          if [ -z "$RUST_VERSION" ]; then
            echo "could not read the rust pin from mise.toml" >&2
            exit 1
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multi-guest' }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build and install eryx-python with dev dependencies
        shell: bash
        working-directory: crates/eryx-python
        run: |
          uv venv ../../.venv
          source ../../.venv/Scripts/activate
          uv pip install maturin
          # pyeryx depends on eryx-run: this repo's, so changes to both are tested together
          uv pip install -e ../../sdk/python
          maturin develop --release
          uv export --extra dev --no-dev --no-hashes --no-emit-project --frozen | uv pip install -r -

      # Windows file-sharing rules make concurrent use of the runtime cache
      # fail where POSIX would work (#850), and these tests run nowhere else on
      # Windows. The test build has its own features and dev-dependencies, so
      # it doesn't reuse maturin's build above; rust-cache covers it instead.
      - name: Run runtime cache concurrency tests
        shell: bash
        run: cargo test --release -p eryx --features embedded --lib -- concurrent

      - name: Run Python tests
        shell: bash
        working-directory: crates/eryx-python
        run: |
          source ../../.venv/Scripts/activate
          pytest tests/ -v -n auto

