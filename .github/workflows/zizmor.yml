# Audit the workflows and composite actions with zizmor
# (https://docs.zizmor.sh), so an unpinned action, an over-broad token or a
# cache restored into a release fails CI instead of landing quietly.
#
# Findings fail the job (annotated on the PR) rather than going to Code
# Scanning: a SARIF upload never blocks a merge on its own. Suppressions live
# in .github/zizmor.yml or as inline `# zizmor: ignore[...]` comments.

name: zizmor

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'dist-workspace.toml'
  pull_request:
    paths:
      - '.github/**'
      - 'dist-workspace.toml'

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
