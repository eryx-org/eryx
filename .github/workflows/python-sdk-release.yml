# Release workflow for eryx-run, the hosted client (sdk/python)
#
# Publishes the pure-Python wheel and sdist to PyPI with trusted publishing.
# Runs on a GitHub Release whose tag is `eryx-run-python-v<version>` (the
# version in sdk/python/pyproject.toml), which release-please publishes when
# its release PR is merged (release-please.yml), or by hand.

name: Python SDK Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# No caches: everything here ships to users (see python-release.yml).

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'eryx-run-python-v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        working-directory: sdk/python
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "eryx-run-python-v$version" ]; then
            echo "Tag $TAG doesn't match version $version in pyproject.toml" >&2
            exit 1
          fi

      - name: Test
        working-directory: sdk/python
        run: |
          uv run --frozen mypy
          uv run --frozen pytest

      - name: Build
        working-directory: sdk/python
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: sdk/python/dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    # By hand, only from main: a published version can't be replaced
    if: >-
      github.event_name == 'release' ||
      (inputs.publish && github.ref == 'refs/heads/main')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
