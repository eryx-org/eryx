# JavaScript package release workflow for @bsull/eryx
#
# This workflow builds, tests, and publishes the npm package.
# It runs on:
# - GitHub Release published (filtered to eryx-v* tags, triggered by release-plz)
# - Manual workflow dispatch
#
# npm provenance is provided via OIDC - no NPM_TOKEN secret needed.
# Configure "trusted publishers" on npmjs.com for this repo.

name: JS Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# No GitHub Actions caches anywhere in this workflow (no WASM, rust-cache, mise
# or npm caching). Everything here ships to users, and a cache entry written by
# any earlier run on main is restored as-is, so a poisoned entry would flow
# straight into the published package. See zizmor's cache-poisoning audit.

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Only run for the main eryx crate release, not the other crates.
    #
    # `startsWith(tag, 'eryx-v')` alone is NOT enough: release-plz tags are
    # `{crate}-v{version}`, and "eryx-vfs-v0.6.0" starts with "eryx-v" too, so
    # eryx-vfs releases were also triggering this. The other crates happen not to
    # collide (eryx-macros, eryx-precompile, eryx-runtime), but any future crate
    # whose name starts with "v" after the dash would need excluding here as well.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.release.tag_name, 'eryx-v') &&
       !startsWith(github.event.release.tag_name, 'eryx-vfs-v'))
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false

      - name: Build and test JS bindings
        working-directory: js
        run: mise run test

      - name: Upload JS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-package
          path: js/eryx/
          retention-days: 5

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download JS package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-package
          path: package/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: package
        run: npm publish --provenance --access public
