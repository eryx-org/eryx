# JavaScript package release workflow for @eryx-org/eryx (formerly @bsull/eryx)
#
# This workflow builds, tests, and publishes the npm package.
# It runs on:
# - GitHub Release published (filtered to eryx-v* tags, triggered by release-plz)
# - Manual workflow dispatch
#
# npm provenance is provided via OIDC - no NPM_TOKEN secret needed.
# Configure "trusted publishers" on npmjs.com for this repo.

name: JS Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The package is built by js-build.yml, without GitHub Actions caches.

jobs:
  build-and-test:
    name: Build & Test
    # Only the eryx release: release-plz creates no releases for the other
    # crates (release-plz.toml), and this skips the SDKs' release-please ones.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'eryx-v')
    uses: ./.github/workflows/js-build.yml

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download JS package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-package
          path: package/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: package
        run: npm publish --provenance --access public
