# Release dry run: build everything a release publishes, end to end, and
# publish nothing.
#
# Runs the same build workflows the releases call:
# - runtime-build.yml: runtime-{python,javascript,shell}.wasm, coreutils.wasm,
#   the JavaScript bundler eryx-bundler.wasm, their .sha256 and their
#   .notices.md, the GitHub release assets (kept here as the `runtime-assets`
#   artifact);
# - python-build.yml: every pyeryx wheel, the sdist and the companion wheels,
#   smoke-tested on Linux, macOS and Windows;
# - js-build.yml: the npm package;
# plus both eryx-server images, for amd64 and arm64, built in the Dockerfile's
# from-source mode (RUNTIME_SOURCE=default) and checked to serve every
# language they include.
#
# Nothing is pushed, uploaded to a release or published to a registry: every
# job only has `contents: read`. It runs on pull requests that change one of
# the build workflows above or what they build from (not the *-release.yml
# workflows that call them: the dry run doesn't run those); run it by hand
# before a release from a long-lived branch. On pull requests the `changes`
# job runs only the parts (wheels, npm package, images) whose inputs
# changed; manual runs do every part.

name: Release Dry Run

on:
  workflow_dispatch:
  # Also on pull requests that change how a release is built.
  pull_request:
    branches: [main, multi-guest]
    # Add a new path to the `changes` job's filters too, or a pull request
    # changing only it skips every part.
    paths:
      - .github/workflows/release-dry-run.yml
      - .github/workflows/runtime-build.yml
      - .github/workflows/python-build.yml
      - .github/workflows/js-build.yml
      - crates/eryx-server/Dockerfile
      - '**/.dockerignore'
      # The wheels' metadata and licence files, and their notices check.
      - crates/eryx-python/pyproject.toml
      - crates/eryx-python/runtimes/**
      - scripts/check-wheel-notices.py
      - scripts/sync-runtime-versions.sh
      # What the runtimes' notices are made from.
      - scripts/notices.py
      # coreutils' crates are only checked when its notices are written.
      - clis/coreutils.toml
      - clis/patches/**
      - third_party/**
      - about.toml
      - mise.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which parts of the dry run a pull request's changes can affect. Manual
  # runs do every part.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      wheels: ${{ github.event_name != 'pull_request' || steps.filter.outputs.wheels == 'true' }}
      js: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js == 'true' }}
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Every path in `on.pull_request.paths` but the Dockerfile,
            # .dockerignore and js-build.yml.
            wheels:
              - .github/workflows/release-dry-run.yml
              - .github/workflows/runtime-build.yml
              - .github/workflows/python-build.yml
              - crates/eryx-python/pyproject.toml
              - crates/eryx-python/runtimes/**
              - scripts/check-wheel-notices.py
              - scripts/sync-runtime-versions.sh
              - scripts/notices.py
              - clis/coreutils.toml
              - clis/patches/**
              - third_party/**
              - about.toml
              - mise.toml
            # The npm package bundles coreutils.
            js:
              - .github/workflows/release-dry-run.yml
              - .github/workflows/js-build.yml
              - clis/coreutils.toml
              - clis/patches/**
              - mise.toml
            # The images, and the runtime-assets they're built from (made by
            # runtime-build.yml, called from python-build.yml). The notices
            # don't go into the images.
            docker:
              - .github/workflows/release-dry-run.yml
              - .github/workflows/runtime-build.yml
              - .github/workflows/python-build.yml
              - crates/eryx-server/Dockerfile
              - '**/.dockerignore'
              - clis/coreutils.toml
              - clis/patches/**
              - mise.toml

  # PRs into multi-guest skip the dry run (the lean subset, as in ci.yml),
  # and so does the release PR until it has the ready-to-release label (see
  # ci.yml); PRs into main and manual runs do it all. Docker needs `python`,
  # so it's skipped with it; when only Docker's inputs changed, `python`
  # builds just the runtimes Docker needs.
  python:
    name: Python
    needs: changes
    if: >-
      github.base_ref != 'multi-guest'
      && !(startsWith(github.head_ref, 'release-plz-')
      && !contains(github.event.pull_request.labels.*.name, 'ready-to-release'))
      && (needs.changes.outputs.wheels == 'true' || needs.changes.outputs.docker == 'true')
    uses: ./.github/workflows/python-build.yml
    with:
      runtimes-only: ${{ needs.changes.outputs.wheels != 'true' }}

  js:
    name: JavaScript
    needs: changes
    if: >-
      github.base_ref != 'multi-guest'
      && !(startsWith(github.head_ref, 'release-plz-')
      && !contains(github.event.pull_request.labels.*.name, 'ready-to-release'))
      && needs.changes.outputs.js == 'true'
    uses: ./.github/workflows/js-build.yml

  docker:
    name: Docker (${{ matrix.variant }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # python-build.yml builds the runtimes (runtime-build.yml) first.
    needs: [changes, python]
    if: needs.changes.outputs.docker == 'true'
    strategy:
      fail-fast: false
      matrix:
        variant: [python-only, all-languages]
        arch: [amd64, arm64]
        include:
          - variant: python-only
            languages: python
          - variant: all-languages
            languages: python,javascript,shell
          - arch: amd64
            runner: ubuntu-latest
            cpu-features: x86-64-v2
          # Native, as ci.yml builds it. No cpu-features: an empty
          # ERYX_CPU_FEATURES takes the Dockerfile's per-architecture default,
          # "baseline" on arm64.
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download runtime assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-assets
          path: crates/eryx-runtime/

      # From source: the image precompiles each runtime-<language>.wasm itself.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/eryx-server/Dockerfile
          build-args: |
            RUNTIME_SOURCE=default
            ERYX_LANGUAGES=${{ matrix.languages }}
            ERYX_CPU_FEATURES=${{ matrix.cpu-features }}
          push: false
          load: true
          tags: eryx-server:${{ matrix.variant }}

      - name: Report image size
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          size=$(docker image inspect "eryx-server:$VARIANT" | jq '.[0].Size')
          echo "$VARIANT $ARCH image size: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      # Each language the image includes runs, and the others are refused.
      - name: Execute each language
        env:
          VARIANT: ${{ matrix.variant }}
          LANGUAGES: ${{ matrix.languages }}
        run: |
          docker run -d --name eryx -p 50051:50051 "eryx-server:$VARIANT"
          trap 'docker logs eryx; docker rm -f eryx' EXIT
          grpcurl() {
            # -i: the request comes on stdin (`-d @`).
            docker run --rm -i --network host -v "$PWD/crates/eryx-server/proto:/proto:ro" \
              fullstorydev/grpcurl:v1.9.3 -plaintext -import-path /proto -proto eryx/v1/eryx.proto "$@"
          }
          # Wait for the server to listen (it builds the Python pool first).
          for _ in $(seq 60); do
            (exec 3<>/dev/tcp/127.0.0.1/50051) 2>/dev/null && break
            sleep 2
          done
          run() {
            jq -nc --arg code "$2" --arg language "LANGUAGE_${1^^}" \
              '{execute_request: {code: $code, language: $language}}' \
              | grpcurl -d @ localhost:50051 eryx.v1.Eryx/Execute 2>&1 || true
          }
          check() {
            out=$(run "$1" "$2")
            echo "$1: $out"
            if [[ ",$LANGUAGES," == *",$1,"* ]]; then
              # "NDIK" is base64 for "42\n".
              grep -Eq '"stdout": *"NDIK"' <<<"$out"
            else
              grep -q 'InvalidArgument' <<<"$out"
            fi
          }
          check python 'print(6 * 7)'
          check javascript 'console.log(6 * 7)'
          check shell "echo \$((6 * 7))"
