# Release dry run: build everything a release publishes, end to end, and
# publish nothing.
#
# Runs the same build workflows the releases call:
# - runtime-build.yml: runtime-{python,javascript,shell}.wasm, coreutils.wasm
#   and their .sha256, the GitHub release assets (kept here as the
#   `runtime-assets` artifact);
# - python-build.yml: every pyeryx wheel, the sdist and the companion wheels,
#   smoke-tested on Linux, macOS and Windows;
# - js-build.yml: the npm package;
# plus both eryx-server images, built in the Dockerfile's from-source mode
# (RUNTIME_SOURCE=default) and checked to serve every language they include.
#
# Nothing is pushed, uploaded to a release or published to a registry: every
# job only has `contents: read`. It runs on pull requests that change a
# release workflow; run it by hand before a release from a long-lived branch.

name: Release Dry Run

on:
  workflow_dispatch:
  # Also on pull requests that change how a release is built.
  pull_request:
    branches: [main, multi-guest]
    paths:
      - .github/workflows/release-dry-run.yml
      - .github/workflows/runtime-build.yml
      - .github/workflows/python-build.yml
      - .github/workflows/python-release.yml
      - .github/workflows/js-build.yml
      - .github/workflows/js-release.yml
      - .github/workflows/upload-runtime.yml
      - crates/eryx-server/Dockerfile
      - crates/eryx-python/runtimes/**
      - scripts/sync-runtime-versions.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python
    uses: ./.github/workflows/python-build.yml

  js:
    name: JavaScript
    uses: ./.github/workflows/js-build.yml

  docker:
    name: Docker (${{ matrix.variant }})
    runs-on: ubuntu-latest
    # python-build.yml builds the runtimes (runtime-build.yml) first.
    needs: python
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: python-only
            languages: python
          - variant: all-languages
            languages: python,javascript,shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download runtime assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-assets
          path: crates/eryx-runtime/

      # From source: the image precompiles each runtime-<language>.wasm itself.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/eryx-server/Dockerfile
          build-args: |
            RUNTIME_SOURCE=default
            ERYX_LANGUAGES=${{ matrix.languages }}
            ERYX_CPU_FEATURES=x86-64-v2
          push: false
          load: true
          tags: eryx-server:${{ matrix.variant }}

      - name: Report image size
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          size=$(docker image inspect "eryx-server:$VARIANT" | jq '.[0].Size')
          echo "$VARIANT image size: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      # Each language the image includes runs, and the others are refused.
      - name: Execute each language
        env:
          VARIANT: ${{ matrix.variant }}
          LANGUAGES: ${{ matrix.languages }}
        run: |
          docker run -d --name eryx -p 50051:50051 "eryx-server:$VARIANT"
          trap 'docker logs eryx; docker rm -f eryx' EXIT
          grpcurl() {
            # -i: the request comes on stdin (`-d @`).
            docker run --rm -i --network host -v "$PWD/crates/eryx-server/proto:/proto:ro" \
              fullstorydev/grpcurl:v1.9.3 -plaintext -import-path /proto -proto eryx/v1/eryx.proto "$@"
          }
          # Wait for the server to listen (it builds the Python pool first).
          for _ in $(seq 60); do
            (exec 3<>/dev/tcp/127.0.0.1/50051) 2>/dev/null && break
            sleep 2
          done
          run() {
            jq -nc --arg code "$2" --arg language "LANGUAGE_${1^^}" \
              '{execute_request: {code: $code, language: $language}}' \
              | grpcurl -d @ localhost:50051 eryx.v1.Eryx/Execute 2>&1 || true
          }
          check() {
            out=$(run "$1" "$2")
            echo "$1: $out"
            if [[ ",$LANGUAGES," == *",$1,"* ]]; then
              # "NDIK" is base64 for "42\n".
              grep -Eq '"stdout": *"NDIK"' <<<"$out"
            else
              grep -q 'InvalidArgument' <<<"$out"
            fi
          }
          check python 'print(6 * 7)'
          check javascript 'console.log(6 * 7)'
          check shell "echo \$((6 * 7))"
