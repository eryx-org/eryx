# Lint the workflows and composite actions.
#
# actionlint (https://github.com/rhysd/actionlint) checks workflow syntax and
# expressions, and runs shellcheck over every `run:` script. Both tools are
# pinned in mise.toml; run the same check locally with `mise run lint-actions`.
# Configuration lives in .github/actionlint.yaml.
#
# zizmor (https://docs.zizmor.sh) audits them for security problems, so an
# unpinned action, an over-broad token or a cache restored into a release
# fails CI instead of landing quietly. Findings fail the job (annotated on the
# PR) rather than going to Code Scanning: a SARIF upload never blocks a merge
# on its own. Suppressions live in .github/zizmor.yml or as inline
# `# zizmor: ignore[...]` comments.

name: workflow-lint

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'dist-workspace.toml'
      - 'mise.toml'
  pull_request:
    paths:
      - '.github/**'
      - 'dist-workspace.toml'
      - 'mise.toml'

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # Only the linters; the rest of mise.toml is the Rust toolchain.
          install_args: actionlint shellcheck
          cache: false

      # Called directly: `mise run` would first install every tool in
      # mise.toml, Rust toolchain and cargo installs included.
      - name: Run actionlint
        run: actionlint

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
