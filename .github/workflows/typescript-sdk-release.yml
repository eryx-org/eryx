# Release workflow for @eryx-org/eryx-run, the hosted client (sdk/typescript)
#
# Publishes to npm with trusted publishing (OIDC, with provenance; no
# NPM_TOKEN). Runs on a GitHub Release whose tag is
# `eryx-run-typescript-v<version>` (the version in sdk/typescript/package.json),
# which release-please publishes when its release PR is merged
# (release-please.yml), or by hand.

name: TypeScript SDK Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# No caches: everything here ships to users (see python-release.yml).

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'eryx-run-typescript-v')
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "eryx-run-typescript-v$version" ]; then
            echo "Tag $TAG doesn't match version $version in package.json" >&2
            exit 1
          fi

      - name: Test
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: sdk/typescript/*.tgz

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    # By hand, only from main: a published version can't be replaced
    if: >-
      github.event_name == 'release' ||
      (inputs.publish && github.ref == 'refs/heads/main')
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --provenance --access public package/*.tgz
