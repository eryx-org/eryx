name: Release-plz

permissions: {}

on:
  push:
    branches:
      - main

jobs:
  # Create GitHub releases and publish to crates.io.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'eryx-org' }}
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      # Mint a GitHub App installation token. release-plz must NOT use the
      # default GITHUB_TOKEN to push tags / create releases: GitHub suppresses
      # workflow runs triggered by the default token, so the cargo-dist
      # (release.yml) and Python/JS release workflows downstream of these
      # tags/releases never fire. An App token is exempt from that rule.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          # Scope the token to what release-plz needs (tags + releases) rather
          # than every permission the App installation holds.
          permission-contents: write
          permission-pull-requests: read

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'eryx-org' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Use an App token so the release PR is opened by the App (not the
      # default token), which lets the PR's CI checks run. See the note in the
      # release job above.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      # release-plz runs cargo-semver-checks with its default (all-features)
      # heuristic, which enables the `embedded` feature. That feature's build
      # script requires a `runtime-python.cwasm`; without one it panics, the semver
      # check silently no-ops, and API-breaking changes (e.g. new public struct
      # fields) slip through as a patch bump instead of a minor one.
      #
      # For the semver check the cwasm is only embedded as bytes for rustdoc and
      # is never deserialized or executed, so an empty placeholder is sufficient
      # (identical to how the crate's own build.rs handles docs.rs builds). This
      # avoids building the real WASM runtime here just to satisfy the check.
      - name: Provide placeholder cwasms for cargo-semver-checks
        run: |
          : > "$RUNNER_TEMP/runtime-python.cwasm"
          echo "ERYX_RUNTIME_CWASM=$RUNNER_TEMP/runtime-python.cwasm" >> "$GITHUB_ENV"
          for lang in JAVASCRIPT SHELL; do
            : > "$RUNNER_TEMP/runtime-$lang.cwasm"
            echo "ERYX_RUNTIME_CWASM_$lang=$RUNNER_TEMP/runtime-$lang.cwasm" >> "$GITHUB_ENV"
          done
          # The shell's embedded coreutils (the `coreutils` feature, #809).
          : > "$RUNNER_TEMP/coreutils.cwasm"
          echo "ERYX_COREUTILS_CWASM=$RUNNER_TEMP/coreutils.cwasm" >> "$GITHUB_ENV"

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # pyeryx's runtime companions (pyeryx-runtime-javascript/-shell) are
      # released at exactly pyeryx's version, which release-plz doesn't know
      # about. Lock them to the new version on the release PR's branch, pushing
      # with the App token so the PR's CI runs on the result. release-plz
      # regenerates the branch when main moves, and this runs again then.
      - name: Lock the pyeryx runtime companions to the release version
        env:
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch=$(printf '%s' "$RELEASE_PR" | jq -r '.head_branch // empty')
          if [ -z "$branch" ]; then
            echo "No release PR opened or updated."
            exit 0
          fi
          git fetch origin "$branch"
          git switch --detach "origin/$branch"
          scripts/sync-runtime-versions.sh
          if git diff --quiet; then
            exit 0
          fi
          git -c user.name="eryx-release-plz[bot]" -c user.email="eryx-release-plz[bot]@users.noreply.github.com" \
            commit -am "chore: lock pyeryx runtime companions to the release version"
          git push origin "HEAD:refs/heads/$branch"
