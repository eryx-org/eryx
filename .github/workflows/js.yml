name: js

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "multi-guest"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_EXPERIMENTAL: 1
  # Fail if the committed crates/eryx-runtime/prebuilt/ is stale (see ci.yml).
  ERYX_REQUIRE_FRESH_PREBUILT: "1"

permissions: {}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            js:
              - 'crates/eryx-core/**'
              - 'crates/eryx/**'
              - 'crates/eryx-guest-python/**'
              - 'crates/eryx-guest-js/**'
              - 'crates/eryx-guest-shell/**'
              - 'crates/wit-dylib-ffi/**'
              - 'crates/eryx-runtime/**'
              - 'js/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '.github/workflows/js.yml'

  build:
    name: JavaScript bindings
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.js == 'true'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache WASM runtime
        id: wasm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/eryx-runtime/runtime-python.wasm
          key: wasm-runtime-v3-${{ hashFiles('crates/eryx-guest-python/src/**', 'crates/eryx-guest-python/clock_stubs.c', 'crates/eryx-guest-python/Cargo.toml', 'crates/wit-dylib-ffi/**', 'crates/eryx-runtime/build.rs', 'crates/eryx-runtime/src/**', 'crates/eryx-runtime/wit/**', 'crates/eryx-runtime/libs/*.zst', 'Cargo.lock', 'Cargo.toml', 'mise.toml') }}

      - name: Touch cached WASM
        if: steps.wasm-cache.outputs.cache-hit == 'true'
        run: |
          # Touch runtime-python.wasm so mise considers wasm-build task current
          touch crates/eryx-runtime/runtime-python.wasm

      # The JavaScript and shell runtimes, each keyed on what it's built from
      # (as in ci.yml, which caches their cwasms too, under other keys).
      - name: Cache JavaScript runtime
        id: wasm-cache-javascript
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/eryx-runtime/runtime-javascript.wasm
          key: wasm-runtime-javascript-wasm-v1-${{ hashFiles('crates/eryx-guest-js/**', 'crates/eryx-guest-python/clock_stubs.c', 'crates/wit-dylib-ffi/**', 'crates/eryx-runtime/build.rs', 'crates/eryx-runtime/wit/**', 'crates/eryx-runtime/libs/*.zst', 'Cargo.lock', 'Cargo.toml', 'mise.toml') }}

      - name: Cache shell runtime
        id: wasm-cache-shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/eryx-runtime/runtime-shell.wasm
          key: wasm-runtime-shell-wasm-v1-${{ hashFiles('crates/eryx-guest-shell/**', 'crates/eryx-runtime/wit/**', 'Cargo.toml', 'mise.toml') }}

      - name: Touch cached guest WASM
        if: steps.wasm-cache-javascript.outputs.cache-hit == 'true' && steps.wasm-cache-shell.outputs.cache-hit == 'true'
        run: |
          # So mise considers the wasm-build-guests task current
          touch crates/eryx-runtime/runtime-javascript.wasm crates/eryx-runtime/runtime-shell.wasm

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/setup-rust

      - name: Force rebuild (cache may have stale timestamps)
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          find crates/eryx-guest-python/src -name "*.rs" -exec touch {} +
          find crates/eryx-runtime/wit -name "*.wit" -exec touch {} +

      - name: Build and test JavaScript bindings
        working-directory: js
        run: mise run test

      # Workers behave differently in browsers (a message sent before the
      # Worker's listener exists is dropped), so run the timeoutMs sandboxes
      # in headless Chromium too.
      - name: Test in Chromium
        working-directory: js/demo
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell
          npx vitest run test/browser.test.ts
