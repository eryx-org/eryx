# cargo-about configuration for the third-party notices that ship with eryx's
# binaries, wheels, npm package, image and runtimes (#837). `mise run notices`
# renders them with third_party/about.hbs for each Cargo lock and target; CI's
# `notices` job runs the same check, so a crate whose licence isn't accepted
# here, or can't be determined, fails it.
#
# Accepted licences, in order of preference. A dual-licensed crate gets the
# first of its options listed here. Copyleft licences aren't listed, so these
# crates get their permissive option (decided, #930):
#   ittapi, ittapi-sys: GPL-2.0-only OR BSD-3-Clause -> BSD-3-Clause
#   self_cell: Apache-2.0 OR GPL-2.0-only -> Apache-2.0
#   r-efi: MIT OR Apache-2.0 OR LGPL-2.1-or-later -> MIT
#
# About 89 crates ship no licence file with a copyright line, so their notices
# are cargo-about's licence templates without one (ittapi is one). That's
# accepted as is (#930): the template text is the licence they declare.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
    "BSL-1.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
]
# Only what ends up in a shipped artifact.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The Rust standard library's compiler_builtins (scripts/notices.py, STD)
# declares "MIT AND Apache-2.0 WITH LLVM-exception AND (MIT OR Apache-2.0)",
# but its LICENSE.txt, which gives the LLVM exception's text, is one
# directory up, where cargo-about doesn't look. The checksum is that file's
# in rust-src; a toolchain whose file changes fails the notices until this is
# updated.
[compiler_builtins.clarify]
license = "MIT AND Apache-2.0 WITH LLVM-exception AND (MIT OR Apache-2.0)"

[[compiler_builtins.clarify.files]]
path = "../LICENSE.txt"
license = "MIT AND Apache-2.0 WITH LLVM-exception AND (MIT OR Apache-2.0)"
checksum = "ab6eec6caf0fa5775e411c7a8bc6a45c4ef2956b0980b157ab74fc5cd62a928b"
