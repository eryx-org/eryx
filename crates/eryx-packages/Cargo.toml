[package]
name = "eryx-packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Resolve, fetch and cache packages for eryx sandboxes (npm today)"
readme = "README.md"

[dependencies]
base64.workspace = true
flate2.workspace = true
futures = { workspace = true, optional = true }
hex.workspace = true
nodejs-semver = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["fs"], optional = true }
webpki-roots = { workspace = true, optional = true }

[features]
default = ["npm"]
# The npm registry client (`npm`, `fetch`): resolving, downloading and
# installing packages. Without it the crate is the environment types and the
# registry-neutral helpers, with no HTTP client, for code that only loads
# environments.
npm = [
    "dep:futures",
    "dep:nodejs-semver",
    "dep:reqwest",
    "dep:rustls",
    "dep:tokio",
    "dep:webpki-roots",
]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
