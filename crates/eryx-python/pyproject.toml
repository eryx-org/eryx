[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "pyeryx"
dynamic = ["version"]
description = "Python sandbox powered by WebAssembly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["eryx-run>=0.4"]
license = "MIT OR Apache-2.0"
# eryx's licences (the repo root's) and the third-party notices of everything
# the wheel ships (scripts/notices.py's `host`), which CI copies here before
# building (python-build.yml; checked by scripts/check-wheel-notices.py).
# maturin puts them in the wheel's dist-info/licenses/. Local builds go
# without them.
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "notices/*.md"]
keywords = ["sandbox", "wasm", "webassembly", "security", "isolation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Security",
  "Topic :: Software Development :: Interpreters",
]

[project.scripts]
eryx = "eryx.__main__:main"
pyeryx = "eryx.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-xdist", "mypy", "requests", "httpx", "mcp>=2,<2.4"]
serve = ["mcp>=2,<2.4"]
# The JavaScript and shell runtimes, which the pyeryx wheel doesn't include.
# The versions must match pyeryx's exactly (tests/test_languages.py checks).
javascript = ["pyeryx-runtime-javascript==0.16.1"]
shell = ["pyeryx-runtime-shell==0.16.1"]
all = ["pyeryx-runtime-javascript==0.16.1", "pyeryx-runtime-shell==0.16.1"]

[tool.uv.sources]
# Developed together in this repo (sdk/python)
eryx-run = { path = "../../sdk/python", editable = true }
# Built from runtimes/ here until they're published (#847).
pyeryx-runtime-javascript = { path = "runtimes/javascript" }
pyeryx-runtime-shell = { path = "runtimes/shell" }

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "eryx._eryx"
