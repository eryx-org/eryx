[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pyeryx"
dynamic = ["version"]
description = "Python sandbox powered by WebAssembly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["eryx-run>=0.3"]
license = { text = "MIT OR Apache-2.0" }
keywords = ["sandbox", "wasm", "webassembly", "security", "isolation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Security",
  "Topic :: Software Development :: Interpreters",
]

[project.scripts]
eryx = "eryx.__main__:main"
pyeryx = "eryx.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-xdist", "mypy", "requests", "httpx", "mcp>=2,<2.4"]
serve = ["mcp>=2,<2.4"]
# The JavaScript and shell runtimes, which the pyeryx wheel doesn't include.
# The versions must match pyeryx's exactly (tests/test_languages.py checks).
javascript = ["pyeryx-runtime-javascript==0.15.0"]
shell = ["pyeryx-runtime-shell==0.15.0"]
all = ["pyeryx-runtime-javascript==0.15.0", "pyeryx-runtime-shell==0.15.0"]

[tool.uv.sources]
# Developed together in this repo (sdk/python)
eryx-run = { path = "../../sdk/python", editable = true }
# Built from runtimes/ here until they're published (#847).
pyeryx-runtime-javascript = { path = "runtimes/javascript" }
pyeryx-runtime-shell = { path = "runtimes/shell" }

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "eryx._eryx"
