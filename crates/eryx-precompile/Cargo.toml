[package]
name = "eryx-precompile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CLI tool for pre-compiling eryx WASM runtimes"
[[bin]]
name = "eryx-precompile"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true } #unified
eryx = { workspace = true, features = ["preinit", "embedded-stdlib"] }
hex.workspace = true
reqwest.workspace = true
rustls = { workspace = true, features = ["aws-lc-rs"] }
serde.workspace = true      # --callbacks file
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
walkdir.workspace = true

[features]
# `env build`: build environments (embeds the JavaScript bundler; see eryx's
# `packages` feature). Off by default until releases ship the bundler.
env = ["eryx/packages"]

[package.metadata.cargo-all-features]
# CI checks eryx's feature powerset with `cargo check-all-features -- -p eryx`,
# which runs once per workspace package with that package's features but
# always `-p eryx`, so `env` (a feature of this package) would be passed to
# eryx. Both settings of `env` are covered by the default build and clippy
# --all-features.
skip_package = true

[package.metadata.dist]
dist = true

[lints]
workspace = true
