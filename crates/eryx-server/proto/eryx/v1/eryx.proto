syntax = "proto3";

package eryx.v1;

// The Eryx sandbox execution service.
//
// Provides bidirectional streaming RPC for executing Python code in a
// sandboxed environment with callback support. The client sends an initial
// ExecuteRequest followed by CallbackResponse messages; the server streams
// back CallbackRequest, OutputEvent, and ExecuteResult messages.
service Eryx {
  // Execute Python code with bidirectional callback streaming.
  //
  // Protocol:
  //   1. Client sends ExecuteRequest as the first message
  //   2. Server may send CallbackRequest messages when Python invokes a callback
  //   3. Client responds with CallbackResponse for each CallbackRequest
  //   4. Server streams OutputEvent messages as Python produces output
  //   5. Server sends ExecuteResult as the final message
  //
  // With mounts, the server also sends FsRequest messages as the code uses
  // them, and the client answers each with an FsResponse. With writable
  // mounts, it sends FsChange messages just before the ExecuteResult.
  rpc Execute(stream ClientMessage) returns (stream ServerMessage);
}

// Messages sent from the client (Go worker) to the server (Eryx).
message ClientMessage {
  oneof message {
    ExecuteRequest execute_request = 1;
    CallbackResponse callback_response = 2;
    // The answer to an FsRequest, for one of the request's mounts.
    FsResponse fs_response = 3;
  }
}

// Messages sent from the server (Eryx) to the client (Go worker).
message ServerMessage {
  oneof message {
    CallbackRequest callback_request = 1;
    OutputEvent output_event = 2;
    ExecuteResult execute_result = 3;
    TraceEvent trace_event = 4;
    // A file operation on one of the request's mounts, for the client to
    // answer with an FsResponse.
    FsRequest fs_request = 5;
    // A change the run made to a writable mount, for the client to apply.
    // All of a run's come after its code finishes, before ExecuteResult.
    FsChange fs_change = 6;
    // A path the code used on a mount with report_access. All of a run's
    // come after its FsChanges, before ExecuteResult.
    FsAccess fs_access = 7;
  }
}

// Initial request to execute Python code.
message ExecuteRequest {
  // Python source code to execute.
  string code = 1;

  // Callback declarations that will be available to the Python code.
  // Each declaration defines a callback that Python can invoke via `await name(...)`.
  repeated CallbackDeclaration callbacks = 2;

  // Resource limits for the execution.
  ResourceLimits resource_limits = 3;

  // Whether to stream trace events during execution.
  // When true, the server will send TraceEvent messages for line execution,
  // function calls/returns, exceptions, and callback start/end events.
  bool enable_tracing = 4;

  // Whether to persist Python state between executions.
  // When true, the server will snapshot state after execution and include it
  // in the ExecuteResult. If state_snapshot is also provided, the server will
  // restore that state before executing code.
  bool persist_state = 5;

  // Previously captured state snapshot to restore before execution.
  // Only used when persist_state is true.
  bytes state_snapshot = 6;

  // Supporting files to write to the sandbox filesystem before execution.
  // Files are placed under /eryx/lib/ (MODULE) or /eryx/data/ (DATA) based on
  // their kind. Only MODULE files are added to sys.path for importing.
  repeated SupportingFile files = 7;

  // Network configuration. If absent, networking is disabled entirely.
  NetworkConfig network_config = 8;

  // Secrets to inject into the sandbox.
  // Each secret becomes an environment variable with a random placeholder value.
  // Real values are substituted in HTTP request headers to allowed hosts only.
  // Placeholder values are scrubbed from stdout/stderr by default.
  repeated SecretConfig secrets = 9;

  // Disable placeholder scrubbing on stdout. Default: scrubbing is ON when secrets are present.
  bool disable_stdout_scrub = 10;

  // Disable placeholder scrubbing on stderr. Default: scrubbing is ON when secrets are present.
  bool disable_stderr_scrub = 11;

  // Name of the variable captured from the script and returned in
  // ExecuteResult.result (JSON-serialized). Empty defaults to "result".
  string result_variable = 12;

  // Enable placeholder scrubbing on the structured result (and result_error).
  // Default: OFF. Unlike stdout/stderr (which default to scrubbing ON via the
  // disable_* fields above), the result is a programmatic side channel, so
  // scrubbing is opt-in.
  bool scrub_result = 13;

  // Callback-result replay (optional, backwards-compatible).
  //
  // PRESENCE of this field — even with an empty `entries` list — opts the
  // execution into journaling: the server records every callback invocation and
  // returns the journal in ExecuteResult.callback_journal. When `entries` is
  // non-empty, callbacks are matched by name + canonical args and their cached
  // results are consumed FIFO per key, replayed instead of being dispatched to
  // the client. The first miss (a callback not present in the journal) switches
  // the remainder of the run to live execution.
  //
  // To start a replay session, send an empty `CallbackJournal{}` on the first
  // run and echo back the returned journal on subsequent runs. When this field
  // is ABSENT, execution behaves exactly as before (no journaling, no replay).
  //
  // SECURITY: replayed entries are returned to Python verbatim — the callback
  // is not re-executed. A valid HMAC signature (see CallbackJournal.signature)
  // attests that the journal is an unmodified record of a real execution of
  // THIS SCRIPT on a server holding the signing key. Signing does not (and
  // cannot) prevent the callback-answering client from choosing arbitrary
  // values live — it always could. What it provides is provenance and tamper
  // detection for journals that round-trip through storage or intermediaries.
  // The server rejects non-empty unsigned or mis-signed journals with
  // FAILED_PRECONDITION before executing the script. An empty, unsigned journal
  // starts a new journaling session and does not require a signature.
  CallbackJournal callback_journal = 14;

  // The guest language `code` is written in. LANGUAGE_UNSPECIFIED is Python.
  // A language the server doesn't serve (see its --languages flag) is
  // rejected with INVALID_ARGUMENT.
  Language language = 15;

  // Shell only: the commands this execution may spawn, out of those the
  // server registered. Unset allows them all; set with no names allows none.
  // Names the server doesn't have are ignored. Other commands exit 127, as
  // if not installed. The shell's grep builtin and nested sh/bash count as
  // commands here; other builtins and callbacks aren't restricted. Setting it for another
  // language is INVALID_ARGUMENT.
  AllowedCommands allowed_commands = 16;

  // Shell only: per-execution options for some of the server's commands, by
  // name. They can only take away from what a command has: a network no wider
  // than network_config.child_network, and no tunnels or spawning even if the
  // server grants them (--shell-command-tunnels, --shell-command-spawn). A name
  // the server doesn't have, network for a command when child_network gives
  // children none, or setting it for another language is INVALID_ARGUMENT.
  map<string, CommandOptions> commands = 17;

  // The name of one of the server's environments (see its --environments
  // flag) to mount read-only, so the code can import its packages. Empty: no
  // environment. A name the server doesn't have, or an environment for
  // another language than `language`, is INVALID_ARGUMENT. A callback
  // journal is bound to the environment it was recorded under: its name and
  // content hash, so repacking an environment invalidates its journals.
  string environment = 18;

  // Install the callbacks under this namespace rather than as top-level
  // names: with "tools", the callback get_time is `await tools.get_time()` in
  // Python and JavaScript and the command `tools.get_time` in the shell.
  // CallbackRequest.name stays the declared name, without the namespace.
  // Empty (the default) installs them as top-level names. A namespace that
  // isn't an identifier ([A-Za-z_][A-Za-z0-9_]*), or that collides with a
  // name the guest uses itself, is INVALID_ARGUMENT. A callback journal is
  // bound to the namespace it was recorded under.
  string callback_namespace = 19;

  // Python and JavaScript: data for the script, as a JSON object whose
  // top-level keys become globals before the code runs, e.g.
  // {"inputs": [1, 2], "args": {"verbose": true}}. Each key must match
  // [A-Za-z_][A-Za-z0-9_]* and must not be a keyword, a name the guest
  // already has (a Python builtin or dunder, a JavaScript global) or a
  // callback's name (callback_namespace, when that's set).
  // The code is passed through untouched, so `from __future__` imports and
  // leading JavaScript `import`s still work and line numbers don't shift.
  // Not scrubbed from output: put secrets in `secrets`, not here. With
  // persist_state the globals are kept in the snapshot like any other
  // variable, and a later request's globals overwrite them (in JavaScript a
  // restored `const` can't be, and the execution fails). Counts towards
  // the server's message size limit like `code`. Empty means none; anything
  // else that isn't such an object, or setting it for the shell, is
  // INVALID_ARGUMENT.
  string globals = 20;

  // Directories the client serves to the code, without uploading them
  // first: read-only unless Mount.writable. As the code uses one, the server sends FsRequests for what's
  // in it, and the client answers each with an FsResponse carrying its
  // op_id. The client decides what each path serves, so don't serve files
  // such as `.env` or `.git/config` unless you mean to. See Mount.
  repeated Mount mounts = 21;

  // Environment variables for the code, by name, e.g. {"GIT_AUTHOR_NAME":
  // "Eryx"}: in Python's os.environ, JavaScript's process.env, and exported
  // in the shell, so its commands inherit them. For ordinary configuration:
  // values aren't secrets and aren't scrubbed from output, so put secrets in
  // `secrets`, not here. Each name must match [A-Za-z_][A-Za-z0-9_]* and
  // must not be one the sandbox sets itself (HOME, PATH, PWD, USER, TMPDIR,
  // TERM, LANG, LC_ALL), one the shell manages (any BASH*, UID, EUID, PPID,
  // RANDOM, SRANDOM, SECONDS, LINENO, SHELLOPTS, ...), whichever the
  // language, or a secret's name; a value must not contain a NUL byte;
  // INVALID_ARGUMENT otherwise. They're set before the code runs;
  // JavaScript's process.env is frozen. With persist_state, the request's
  // variables replace restored values of the same names; the shell's
  // snapshot also keeps the variables an earlier request exported, while
  // Python and JavaScript start each request from only this request's. A
  // callback journal is bound to the variables it was recorded with. Counts
  // towards the server's message size limit like `code`.
  map<string, string> env = 22;
}

// A directory the client serves to the code; see ExecuteRequest.mounts.
//
// A mount is read-only unless `writable`: writing, creating or deleting
// files in it fails.
//
// A run reads each thing once: a file changed on the client mid-run may be
// seen as it was, and reads stop at the size the file had when the code
// first looked at it. Reads fetch 256 KiB at a time. The server's
// --max-mount* flags bound each run: by default it keeps up to 16 MiB of
// file data and 16 MiB of listings, makes at most 1000 FsRequests and is
// sent at most 256 MiB of FsResponses, after which the code's file
// operations on its mounts fail with an OSError (EIO). Each FsResponse must
// fit in the server's message size limit. Mounts aren't
// saved with persist_state, nor recorded in a callback journal: a replay
// asks for them again.
message Mount {
  // Where the code sees it: a path under one of the server's --mount-root
  // directories, by default /mnt/ (so /mnt/repo, not /mnt), without `.`,
  // `..`, empty components or a trailing slash. A root the operator gives
  // without a trailing slash, like /workspace, takes a mount at it too. A
  // request can have up to the server's --max-mounts (8 by default), none
  // inside another (INVALID_ARGUMENT otherwise).
  string path = 1;

  // Let the code change the mount. The client's files are never written
  // during the run: the changes are kept on the server, over the client's
  // files, and sent as FsChange messages once the code finishes, before the
  // ExecuteResult, for the client to apply (or not: check
  // ExecuteResult.success). They're sent for a failed run too, as far as
  // its code got, but not when the run is cancelled or suspends (a resumed
  // run starts again from the client's files).
  //
  // The changes come from the sandboxed code, so treat them as untrusted:
  // resolve each path inside the mount without following symlinks out of
  // it, and think twice before applying writes to files that run code
  // (`.git/hooks`, build scripts, `.env`).
  //
  // Writing part of a file fetches it whole first. The changes may hold up
  // to the server's --max-mount-write-bytes (64 MiB by default), past which
  // writes fail with ENOSPC. Renaming a directory the client served is
  // EXDEV, which code that moves trees (shutil.move, mv) handles by
  // copying. Changes are against what the run saw: a file the client
  // changed mid-run isn't noticed. Times aren't reported. To apply them
  // only if what the code depended on is unchanged, use report_access.
  bool writable = 2;

  // Report the paths the code used on this mount, as FsAccess messages
  // after its FsChanges and before the ExecuteResult, when FsChanges would
  // be sent: for a failed run too, not for a cancelled or suspended one.
  // Only the code's own use counts, wherever it was answered from (the
  // run's cache, a listing's inline content, a fetched block): not the
  // server's lookups to place the code's writes, nor what the code reads
  // back from them. The server's --max-mount-access-entries bounds the
  // paths reported per run, across its mounts; past it,
  // ExecuteResult.fs_accesses_truncated is set and the client must treat
  // everything it served as used.
  bool report_access = 4;
}

// A path the code used on a mount with report_access, once per path with
// its strongest use. A path whose lookup the client refused with an error
// other than NOT_FOUND or NOT_A_DIRECTORY isn't reported: refuse a path
// consistently, or treat its refusal as a change.
message FsAccess {
  // The mount's path, as in ExecuteRequest.mounts.
  string mount = 1;
  // Relative to the mount, like FsChange.path: "" is the mount itself.
  string path = 2;
  Kind kind = 3;
  // The FsMetadata.version the code saw for the path: the file's for READ
  // and STATED, the directory's for LISTED (empty if the run had no
  // metadata of its own for it, as when only listing the mount itself).
  // Empty for MISSING, and when the client sent none. If the client's
  // answers gave it different versions mid-run, the first.
  string version = 4;

  // How the code used the path, weakest first; the strongest wins.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Looked up and not found. Only if the code never saw it exist.
    KIND_MISSING = 1;
    // Used its metadata (kind, size, modification time): a stat or an
    // existence check, including those an open makes.
    KIND_STATED = 2;
    // Read the directory's entries: their names and kinds.
    KIND_LISTED = 3;
    // Read the file's contents, or part of them.
    KIND_READ = 4;
  }
}

// A change a run made to a writable mount. Apply them in the order they
// come: removals deepest first, then new directories parents first, then
// files, each in FsWrite chunks.
message FsChange {
  // The mount's path, as in ExecuteRequest.mounts.
  string mount = 1;
  // Relative to the mount, without `.` or `..` components.
  string path = 2;
  oneof change {
    // Remove the file, or the directory (empty by then).
    FsRemove remove = 3;
    // Make the directory.
    FsMkdir mkdir = 4;
    // Write part of the file's new contents.
    FsWrite write = 5;
  }
}

message FsRemove {}

message FsMkdir {}

// Part of a file's whole new contents, in order and at most 1 MiB each.
// The first chunk is at offset 0, and creates or truncates the file; an
// empty file is one empty chunk.
message FsWrite {
  uint64 offset = 1;
  bytes data = 2;
}

// A file operation on a mount, for the client to answer; see Mount.
message FsRequest {
  // Unique ID for this operation. The FsResponse must carry it.
  string op_id = 1;
  // The mount's path, as in ExecuteRequest.mounts.
  string mount = 2;
  // The file or directory, relative to the mount: "" is the mount itself,
  // and there are no `.` or `..` components.
  string path = 3;
  oneof op {
    // The metadata of `path`: answer with FsResponse.stat.
    FsStat stat = 4;
    // The entries of the directory `path`: answer with FsResponse.listing.
    FsList list = 5;
    // Bytes of the file `path`: answer with FsResponse.data.
    FsRead read = 6;
  }
  // W3C traceparent of the server's span for this operation, so the client
  // can make its handling a child of it, as CallbackRequest.trace_context.
  // Empty when tracing is not configured.
  string trace_context = 7;
}

message FsStat {}

message FsList {}

message FsRead {
  // Where the bytes start in the file.
  uint64 offset = 1;
  // How many to send: at most this many, fewer at the end of the file.
  uint64 len = 2;
}

// The client's answer to an FsRequest.
message FsResponse {
  // The op_id of the FsRequest this answers. An answer for an operation the
  // server isn't waiting for is ignored.
  string op_id = 1;
  oneof result {
    // The operation failed.
    FsError error = 2;
    // stat's answer.
    FsMetadata stat = 3;
    // list's answer.
    FsListing listing = 4;
    // read's answer: the bytes from `offset`, at most `len` of them (empty
    // at or past the end of the file).
    bytes data = 5;
  }
}

message FsError {
  // What the code sees: NOT_FOUND is FileNotFoundError, NOT_A_DIRECTORY
  // NotADirectoryError, IS_A_DIRECTORY IsADirectoryError, PERMISSION_DENIED
  // PermissionError, anything else an OSError (EIO). A read's error reaches
  // the code as EIO whatever its code, as the file is open by then: to
  // refuse a file, refuse its stat. Once the code has listed a directory,
  // the listing answers stats of its entries, and a name it doesn't have is
  // NOT_FOUND without asking.
  FsErrorCode code = 1;
  // Details for the server's log and the code's EIO error.
  string message = 2;
}

enum FsErrorCode {
  FS_ERROR_CODE_OTHER = 0;
  FS_ERROR_CODE_NOT_FOUND = 1;
  FS_ERROR_CODE_NOT_A_DIRECTORY = 2;
  FS_ERROR_CODE_IS_A_DIRECTORY = 3;
  FS_ERROR_CODE_PERMISSION_DENIED = 4;
}

// A file's or directory's metadata.
message FsMetadata {
  bool is_dir = 1;
  // The file's size in bytes (ignored for a directory).
  uint64 size = 2;
  // Last modified, in seconds since the Unix epoch. Unset: the epoch.
  optional double modified = 3;
  // An opaque token for this version of the file or directory, such as a
  // content hash, echoed in FsAccess.version. The server doesn't interpret
  // it. Counts towards the run's transfer limit like the rest.
  optional string version = 4;
}

message FsListing {
  // The directory's entries, at most the server's --max-mount-dir-entries
  // (10,000 by default). Names are plain: not empty,
  // `.` or `..`, and without a `/`.
  repeated FsEntry entries = 1;
}

message FsEntry {
  string name = 1;
  FsMetadata metadata = 2;
  // A file's whole contents, `size` bytes, so reading it needs no further
  // FsRequest. Optional: worth sending for small files (the server keeps
  // those up to 64 KiB), as reading a whole tree of them then costs one
  // round trip per directory.
  optional bytes content = 3;
}

// Per-execution options for one of the server's shell commands; see
// ExecuteRequest.commands.
message CommandOptions {
  // The network for this command's children. Unset: the request's
  // child_network. MODE_NONE: none. MODE_INHERIT: the request's
  // child_network. MODE_NARROW: only what both `narrow` and the request's
  // child_network allow; its connections and bytes also count against the
  // request's limits.
  ChildNetwork network = 1;
  // Its children may not open blind tunnels, even if the server allows it
  // (--shell-command-tunnels).
  bool no_tunnels = 2;
  // It may not run commands itself, even if the server allows it
  // (--shell-command-spawn).
  bool no_spawn = 3;
}

// The command names in ExecuteRequest.allowed_commands. A message rather
// than a bare repeated field, so "unset" (all) and "empty" (none) differ.
message AllowedCommands {
  repeated string names = 1;
}

// A guest language.
enum Language {
  // Python, the default.
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_PYTHON = 1;
  // JavaScript, via QuickJS.
  LANGUAGE_JAVASCRIPT = 2;
  // A bash-compatible shell.
  LANGUAGE_SHELL = 3;
}

// Kind of supporting file — determines where it's placed in the sandbox.
enum FileKind {
  // Data file placed in /eryx/data/ (not importable). Default — files are
  // inert unless explicitly marked as modules.
  FILE_KIND_DATA = 0;
  // Python module placed in /eryx/lib/ and added to sys.path.
  FILE_KIND_MODULE = 1;
}

// A supporting file to place in the sandbox filesystem.
message SupportingFile {
  string name = 1;     // e.g. "helpers.py"
  string content = 2;
  FileKind kind = 3;
}

// Declaration of a callback that the Go worker can handle.
message CallbackDeclaration {
  // Callback name (e.g., "query_loki", "query_prometheus").
  // This becomes an async function in Python: `await query_loki(...)`.
  string name = 1;

  // Human-readable description of the callback.
  string description = 2;

  // Parameter definitions for this callback.
  repeated ParameterDeclaration parameters = 3;
}

// Declaration of a single parameter for a callback.
message ParameterDeclaration {
  // Parameter name.
  string name = 1;

  // JSON Schema type: "string", "number", "integer", "boolean", "object", "array".
  string json_type = 2;

  // Human-readable description of the parameter.
  string description = 3;

  // Whether this parameter is required.
  bool required = 4;
}

// Resource limits for sandbox execution.
//
// Every value is clamped to the server's configured ceiling (the
// `--max-*` flags), so a request can lower a limit but never raise it past the
// operator's maximum. Values above a ceiling are clamped, not rejected.
message ResourceLimits {
  // Maximum execution time in milliseconds (0 = default 30s).
  uint64 execution_timeout_ms = 1;

  // Maximum callback timeout in milliseconds (0 = default 10s).
  uint64 callback_timeout_ms = 2;

  // Maximum guest memory in bytes (0 = default 128MB). Enforced: an allocation
  // past it fails inside Python with MemoryError.
  uint64 max_memory_bytes = 3;

  // Maximum number of callback invocations (0 = default 1000).
  uint32 max_callback_invocations = 4;

  // Maximum fuel/instructions (0 = the server's --max-fuel, unlimited if unset).
  uint64 max_fuel = 5;

  // Shell only (ignored for other languages): most host memory the arguments
  // and environments of the execution's child processes may hold at once
  // (0 = the server's --max-child-host-bytes). A spawn past it fails, and the
  // shell reports the command as failed.
  uint64 max_child_host_bytes = 6;

  // Shell only (ignored for other languages): most memory the execution's
  // running child processes may hold together, on top of max_memory_bytes
  // (0 = the server's --max-child-memory-bytes, by default 256 MiB). A
  // command that doesn't fit isn't started, and the shell's stderr says the
  // child memory pool is full.
  uint64 max_child_memory_bytes = 7;
}

// Network configuration for the sandbox.
// Controls which hosts Python code can connect to and sets timeouts.
message NetworkConfig {
  // Allowed host patterns (wildcards ok). Only checked when allow_all_hosts is false.
  repeated string allowed_hosts = 1;
  // Blocked host patterns. Checked before allowed. Empty = Rust defaults
  // (localhost and private-range host names); a non-empty list REPLACES the
  // defaults rather than extending them. Resolved addresses are filtered
  // separately by blocked_networks.
  repeated string blocked_hosts = 2;
  // Maximum concurrent connections (0 = default 10). Clamped to the server's
  // --max-connections.
  uint32 max_connections = 3;
  // Connection timeout in milliseconds (0 = default 30s). Clamped to the
  // server's --max-io-timeout-ms.
  uint64 connect_timeout_ms = 4;
  // I/O read/write timeout in milliseconds (0 = default 60s). Clamped to the
  // server's --max-io-timeout-ms.
  uint64 io_timeout_ms = 5;
  // When true, all non-blocked hosts are allowed (allowed_hosts is ignored).
  // When false (default), only hosts matching allowed_hosts are permitted.
  bool allow_all_hosts = 6;
  // CIDRs (e.g. "10.0.0.0/8") that resolved addresses must not fall in.
  // Empty = Rust defaults (loopback, private, link-local, CGNAT, multicast, ...).
  // To disable address filtering, send allowed_networks = ["0.0.0.0/0", "::/0"].
  repeated string blocked_networks = 7;
  // CIDRs exempt from blocked_networks.
  repeated string allowed_networks = 8;
  // Host patterns allowed to resolve into blocked_networks, for trusted names
  // routed internally on purpose (e.g. via cluster DNS).
  repeated string internal_hosts = 9;
  // Also substitute secret placeholders on plain TCP connections (e.g.
  // http://). When false (default), they are replaced only after a TLS
  // upgrade, and a plain TCP request goes out with the placeholder left in
  // place. Enabling this sends the real secret value unencrypted, readable by
  // anyone on the network path; only use it for trusted local test servers.
  // The server rejects a request that sets it with INVALID_ARGUMENT unless it
  // was started with --allow-plaintext-secrets.
  bool allow_plaintext_secrets = 10;
  // Method and path rules for HTTP requests. A host matching any rule's host
  // only accepts requests matching one of its rules; other hosts are
  // unaffected. With any rule set, every request is parsed and checked
  // against the connected host and the hosts it names, ambiguous framing is
  // refused, and only HTTP/1.1 may be sent to a host with rules. See the
  // eryx crate's `NetConfig::allow_http` for the matching rules.
  repeated HttpRule http_rules = 11;
  // Network for the shell's child processes (external commands). Absent =
  // none: children stay offline. See ChildNetwork.
  ChildNetwork child_network = 12;
}

// How a shell's child processes may reach the network. They connect through a
// proxy on the host, never directly, and never get more than this
// NetworkConfig allows. Only shell requests may set it (INVALID_ARGUMENT
// otherwise).
//
// The request's max_connections bounds the guest's connections and its
// children's together, across both proxies (inspecting and tunnelling); a
// narrow max_connections bounds the children's, below that.
//
// Children see secrets only as their placeholders (the shell exports each
// secret's placeholder as an environment variable). The proxy substitutes a
// real value only in requests to that secret's allowed_hosts, after a TLS
// upgrade (or on plain TCP too with allow_plaintext_secrets), as for the
// guest's own connections. Commands the server allows to tunnel (see its
// --shell-command-tunnels flag) can instead open blind CONNECT tunnels to
// allowed hosts: no secret substitution and no HTTP rules there, and hosts
// with http_rules never get one.
message ChildNetwork {
  enum Mode {
    // No network for children.
    MODE_NONE = 0;
    // Exactly this NetworkConfig's policy.
    MODE_INHERIT = 1;
    // Only what both this NetworkConfig and `narrow` allow. The connection
    // limit and timeouts are the smaller of the two; secrets are this
    // request's.
    MODE_NARROW = 2;
  }
  Mode mode = 1;
  // Required for MODE_NARROW, refused otherwise. Its own child_network and
  // allow_plaintext_secrets must be unset. It starts from the same defaults
  // as any NetworkConfig (blocked_hosts and blocked_networks block localhost
  // and private ranges), not from this one: repeat any allowed_networks,
  // internal_hosts or blocked_* overrides children need.
  NetworkConfig narrow = 2;
}

// HTTP requests allowed to the hosts matching a pattern.
message HttpRule {
  // Host pattern, as in allowed_hosts.
  string host = 1;
  // Allowed methods, compared ignoring case. Empty = any method.
  repeated string methods = 2;
  // Allowed path prefixes, matched on whole segments ("/repos/org/repo"
  // matches "/repos/org/repo/issues" but not "/repos/org/repo-evil"; a path
  // ending in "/" matches anything under it), against the request's
  // percent-decoded path without its query. Empty = any path. Paths must be
  // normalized: no "." or ".." segments, "//", query or escapes.
  repeated string paths = 3;
  // Allowed queries: regular expressions (Rust regex syntax), each matched
  // against the whole raw query string, the text after "?" as sent (not
  // decoded; empty when there's none). "service=git-upload-pack" matches
  // only that query; "(service=git-upload-pack)?" also matches none.
  // Empty = any query.
  repeated string queries = 4;
}

// A secret to inject into the sandbox environment.
// The real value is never exposed to Python code — a random placeholder is
// used instead. The real value is substituted transparently in HTTP headers
// when making requests to allowed_hosts.
message SecretConfig {
  // Secret name: the key of its placeholder in `os.environ` (Python) or
  // `process.env` (JavaScript), or the environment variable the shell exports
  // it as for its commands. Must match `[A-Za-z_][A-Za-z0-9_]*`, a valid shell
  // variable name; any other name is INVALID_ARGUMENT.
  string name = 1;
  // The real secret value. Transmitted in plaintext over the gRPC connection —
  // callers must ensure the transport is secure (e.g. localhost, mTLS, or TLS).
  string value = 2;
  // Hosts where this secret may be sent. Empty = falls back to NetworkConfig.allowed_hosts.
  repeated string allowed_hosts = 3;
  // The only HTTP header the real value may be sent in, compared ignoring
  // case. Empty = any header. A request with the placeholder in another
  // header is refused.
  string header = 4;
  // The only requests the real value may be sent in: a request must match
  // one of these rules (host, methods, paths and queries, matched as
  // NetworkConfig.http_rules are) as well as allowed_hosts, so a rule for
  // a host outside allowed_hosts never matches. Empty = any
  // request to an allowed host. A request with the placeholder that no rule
  // matches is refused.
  repeated HttpRule http_rules = 5;
}

// Server requests the client to execute a callback.
message CallbackRequest {
  // Unique ID for this callback invocation (UUID).
  // The client must include this ID in the corresponding CallbackResponse.
  string request_id = 1;

  // Name of the callback to invoke.
  string name = 2;

  // JSON-encoded arguments object.
  string arguments_json = 3;

  // W3C traceparent header for distributed trace propagation.
  // Allows the client to link callback handling spans as children of the
  // server-side callback span. Empty when tracing is not configured.
  string trace_context = 4;
}

// Client responds with the result of a callback invocation.
message CallbackResponse {
  // The request_id from the corresponding CallbackRequest.
  string request_id = 1;

  oneof result {
    // JSON-encoded result on success.
    string json_result = 2;

    // Error message on failure, or the opaque suspend reason when
    // `outcome == CALLBACK_OUTCOME_SUSPEND`.
    string error = 3;
  }

  // How this callback resolved. Defaults to CALLBACK_OUTCOME_OK / ERROR based on
  // the `result` oneof for backwards compatibility; set to
  // CALLBACK_OUTCOME_SUSPEND to defer execution. When SUSPEND, execution stops
  // cleanly: the callback is reported in ExecuteResult.suspended_callback, the
  // guest is halted before any further code runs, and the journal of completed
  // callbacks is returned so a later run can replay the prefix and resume. The
  // suspend reason is carried in the `error` field of the `result` oneof.
  CallbackOutcome outcome = 4;
}

// How a callback invocation resolved, for journaling and replay.
enum CallbackOutcome {
  // Success — the `value` is the JSON-encoded result.
  CALLBACK_OUTCOME_OK = 0;
  // Permanent failure — the `value` is the error message.
  CALLBACK_OUTCOME_ERROR = 1;
  // Suspend — defer execution. Only valid in CallbackResponse; never recorded in
  // a journal entry (SUSPEND terminates execution before an entry is written).
  CALLBACK_OUTCOME_SUSPEND = 2;
}

// Details of the callback that suspended execution.
message SuspendedCallback {
  // Name of the callback that suspended.
  string name = 1;
  // Canonicalized arguments JSON the callback was invoked with.
  string args_json = 2;
  // The opaque reason string the callback returned.
  string reason = 3;
}

// A single recorded callback invocation in a replay journal.
message CallbackJournalEntry {
  // Position in the invocation sequence (0-indexed, in initiation order).
  uint32 index = 1;
  // Callback name.
  string name = 2;
  // Stable hash of the canonicalized arguments JSON (for fast comparison).
  uint64 args_hash = 3;
  // Canonicalized arguments JSON (for verification/debugging).
  string args_json = 4;
  // Whether the recorded invocation succeeded or failed.
  CallbackOutcome outcome = 5;
  // The JSON-encoded result value (OK) or the error message (ERROR).
  string value = 6;
}

// An ordered journal of callback invocations.
//
// Sent in ExecuteRequest to enable replay/journaling (presence-significant: an
// empty journal still turns journaling on) and returned in ExecuteResult with
// the invocations recorded during the run.
//
// SECURITY: a valid signature attests that this journal is an unmodified record
// of a real execution of a specific script on a server holding the signing key.
// The server signs outgoing journals and rejects unsigned or mis-signed
// journals before execution with FAILED_PRECONDITION (except an empty, unsigned
// journal starting a new session). The MAC covers
// both the entries and the script code, so a journal cannot be replayed against
// a different script. It also covers the state snapshot the run started from,
// the declared callback names, the environment (name and content hash), the
// request's `globals` and `expires_at_unix_secs`: a journal replays only into
// the same script, starting state, callback set, environment and globals, and
// only until it expires (the server's --journal-ttl-secs after signing).
//
// MATCHING: replay matches callbacks by (name, canonical args). Concurrent calls
// with identical (name, args) are indistinguishable to replay; include a
// correlation key in args if stable assignment is required.
message CallbackJournal {
  // Ordered callback invocations, in the order they were initiated.
  repeated CallbackJournalEntry entries = 1;
  // HMAC-SHA256 over the journal entries, script code, starting state,
  // callback names, environment, globals and expiry. Produced by the server
  // using a configured signing key. Empty on the first request (no journal to
  // sign yet); the server returns a signed journal in the result.
  bytes signature = 2;
  // Unix time (seconds) after which the server rejects this journal. Set by
  // the server when signing; echo it back unchanged.
  uint64 expires_at_unix_secs = 3;
}

// Streaming output event from the sandbox.
message OutputEvent {
  // Which output stream this came from.
  OutputStream stream = 1;

  // The output data (raw bytes).
  bytes data = 2;
}

// Output stream identifier.
enum OutputStream {
  STDOUT = 0;
  STDERR = 1;
}

// Final execution result.
message ExecuteResult {
  // Whether execution completed successfully.
  bool success = 1;

  // Complete stdout output (raw bytes).
  bytes stdout = 2;

  // Complete stderr output (raw bytes).
  bytes stderr = 3;

  // Human-readable message for a *sandbox* failure (timeout, fuel exhaustion,
  // WASM trap, invalid input, etc.). Empty when execution succeeded AND empty
  // for a script failure — in that case the traceback is in `stderr` (as
  // CPython would print it) and `failure_kind` is FAILURE_KIND_SCRIPT_FAILED.
  // Use `failure_kind` to branch, not this string.
  string error = 4;

  // Execution statistics.
  ExecuteStats stats = 5;

  // Captured Python state snapshot after execution.
  // Only populated when persist_state was true in the request.
  bytes state_snapshot = 6;

  // JSON-serialized value of the script's result variable (default name
  // "result", configurable via ExecuteRequest.result_variable), or empty if
  // the variable was not set.
  string result = 7;

  // Why result capture failed (e.g. the value was not JSON-serializable), or
  // empty when capture succeeded or no result variable was set.
  string result_error = 8;

  // Why execution failed. FAILURE_KIND_UNSPECIFIED when success is true.
  // Distinguishes a script-level failure (an uncaught exception, with its
  // traceback in `stderr`) from sandbox-level failures (timeout, fuel
  // exhaustion, traps, invalid input), so callers can branch without parsing
  // the `error` string.
  FailureKind failure_kind = 9;

  // The callback journal recorded during this run, in initiation order.
  // Present only when the request opted into replay (sent a callback_journal).
  // Echo it back in the next ExecuteRequest to replay completed callbacks.
  CallbackJournal callback_journal = 10;

  // True if a callback requested suspension (CALLBACK_OUTCOME_SUSPEND). When
  // set, `success` is false and `error` describes the halted (fuel-poisoned)
  // execution — that is expected, not a failure. Branch on `suspended` first;
  // the suspension details are in `suspended_callback` and the prefix journal is
  // in `callback_journal`, ready to resume.
  bool suspended = 11;

  // Details of the callback that suspended, when `suspended` is true.
  SuspendedCallback suspended_callback = 12;

  // Why state persistence failed, or empty when it succeeded (or persist_state
  // was false). Set when the request's state_snapshot could not be restored
  // (the code then ran against a clean state) and/or the post-execution
  // snapshot could not be captured (state_snapshot is then empty and the
  // caller should keep its previous snapshot). Independent of `success`.
  string state_error = 13;

  // True if stdout plus stderr exceeded the server's output cap
  // (--max-output-bytes). Output past the cap was dropped, both from the
  // OutputEvent stream and from `stdout`/`stderr`, and a truncation marker was
  // appended to the stream that crossed it. Also true, without a marker, when
  // the sandbox's own per-execution output stream limit (16 MiB, charging a
  // small overhead per write) dropped output first.
  bool output_truncated = 14;

  // Names of the globals left out of `state_snapshot` because they could not
  // be serialized (e.g. open sockets, generators). They raise NameError after
  // the snapshot is restored. Empty when nothing was skipped or no snapshot
  // was captured.
  repeated string state_skipped_globals = 15;

  // True if the session lost its Python state before the code ran, so it ran
  // against a fresh interpreter: restoring `state_snapshot` was interrupted
  // (e.g. it hit the execution timeout), which discarded the instance. Also
  // reported in `state_error`. Always false when `success` is false.
  bool state_was_reset = 16;

  // The script's exit status, for LANGUAGE_SHELL only: 0 on success, or the
  // nonzero status of a script failure (`failure_kind` FAILURE_KIND_SCRIPT_FAILED).
  // Unset for Python and JavaScript, whose scripts fail by raising, and when
  // the sandbox itself failed (a timeout, a resource limit) before the script
  // could exit.
  optional int32 exit_code = 17;

  // How many FsChange messages came before this, for writable mounts.
  uint32 fs_changes = 18;

  // How many FsAccess messages came before this, for mounts with
  // report_access.
  uint32 fs_accesses = 19;
  // The run used more paths than the server's --max-mount-access-entries:
  // the FsAccess messages are incomplete, so treat everything served to
  // the run as used.
  bool fs_accesses_truncated = 20;
}

// Why an execution failed, when success is false.
enum FailureKind {
  option allow_alias = true;
  // Execution succeeded; no failure.
  FAILURE_KIND_UNSPECIFIED = 0;
  // The script failed: it raised an uncaught exception. The traceback is in
  // `stderr` and `error` is empty.
  FAILURE_KIND_SCRIPT_FAILED = 1;
  // Former name of FAILURE_KIND_SCRIPT_FAILED, kept as an alias.
  FAILURE_KIND_SCRIPT_EXCEPTION = 1 [deprecated = true];
  // Execution exceeded the configured wall-clock timeout.
  FAILURE_KIND_TIMEOUT = 2;
  // Execution exceeded the configured fuel (instruction) limit.
  FAILURE_KIND_FUEL_EXHAUSTED = 3;
  // A sandbox/infrastructure failure: WASM trap, invalid input (e.g. NUL bytes
  // in the code), session creation failure, or an internal runtime error.
  // Details are in `error`.
  FAILURE_KIND_SANDBOX_ERROR = 4;
  // Execution was cancelled before completing (e.g. the client disconnected).
  FAILURE_KIND_CANCELLED = 5;
  // A callback requested suspension (CALLBACK_OUTCOME_SUSPEND). This is an
  // expected control outcome, not a failure: `suspended` is true and the prefix
  // journal / `suspended_callback` carry the state needed to resume. Branch on
  // `suspended` first; this kind is a secondary signal for consumers that key
  // solely on `failure_kind`.
  FAILURE_KIND_SUSPENDED = 6;
}

// A trace event emitted during execution.
// Sent when enable_tracing is true in the ExecuteRequest.
message TraceEvent {
  // Line number in the source code.
  uint32 lineno = 1;

  // Event type: "line", "call", "return", "exception", "callback_start",
  // "callback_end", "process_start", "process_end".
  string event_type = 2;

  // Function name (for "call" and "return" events).
  string function = 3;

  // Error/exception message (for "exception" events, and "callback_end" and
  // "process_end" events that failed).
  string message = 4;

  // Callback or command name (for "callback_*" and "process_*" events).
  string name = 5;

  // Duration in milliseconds (for "callback_end" and "process_end" events).
  uint64 duration_ms = 6;

  // JSON-encoded context, with secret placeholders replaced by [REDACTED];
  // empty when the event has none. A "callback_start" carries the callback's
  // arguments (the JSON object it's called with), and a "process_start" the
  // child's arguments as {"args": [...]}, argv[0] excluded. Context counts
  // against the execution's trace stream budget along with the event.
  string context_json = 7;

  // Numbers an execution's child processes, pairing each "process_start"
  // with its "process_end".
  uint32 pid = 8;

  // A child's exit code ("process_end" events); unset if it failed instead
  // of exiting.
  optional int32 exit_code = 9;

  // The pid of the child that spawned this one ("process_start" events of
  // nested children, spawned through eryx:process run, pipe or spawn);
  // unset for a child of the guest itself.
  optional uint32 ppid = 10;
}

// Execution statistics.
message ExecuteStats {
  // Total execution duration in milliseconds.
  uint64 duration_ms = 1;

  // Number of callback invocations.
  uint32 callback_invocations = 2;

  // Peak memory usage in bytes (0 if unavailable): the guest instance's
  // largest linear memory, plus what its child processes held at the same
  // time (which can take it past the guest's memory limit). In a session
  // that's the peak so far, not just this execution's growth, since memory
  // never shrinks between executions.
  uint64 peak_memory_bytes = 3;

  // Fuel consumed (0 if unavailable).
  uint64 fuel_consumed = 4;

  // Number of callbacks served from the replay journal (cache hits).
  // 0 when replay was not enabled or nothing matched.
  uint32 replayed_callbacks = 5;
}
