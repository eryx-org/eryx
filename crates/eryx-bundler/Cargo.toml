[package]
name = "eryx-bundler"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The JavaScript bundler eryx runs as a sandboxed WASI command: rolldown, for wasm32-wasip2"
publish = false

# A standalone workspace, like eryx-guest-shell: rolldown and its ~280 crates
# stay out of eryx's Cargo.lock, and native `cargo clippy --workspace` never
# builds them. Built to a WASI command with `mise run build-bundler`.
[workspace]

[[bin]]
name = "eryx-bundler"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Pinned exactly: the vendored rolldown_plugin_utils below must be this
# version, and environments record the bundler version they were built with.
rolldown = "=1.3.2"
rolldown_common = "=1.3.2"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[patch.crates-io]
# rolldown_plugin_utils 1.3.2 with its one tokio::fs::read changed to
# std::fs::read: tokio refuses its `fs` feature on wasm. See vendor/README.md.
rolldown_plugin_utils = { path = "vendor/rolldown_plugin_utils" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
